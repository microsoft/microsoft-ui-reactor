name: Package

# ADO equivalent of .github/workflows/release.yml
# Produces framework NuGet packages and reactor skill kit (x64 + arm64).

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - '*'
  paths:
    exclude:
      - docs/guide/**

parameters:
  - name: version
    displayName: Version to pack (manual runs only; e.g. 0.1.0-preview.1)
    type: string
    default: ''

pool:
  vmImage: windows-latest

steps:
  - checkout: self
    fetchDepth: 0
  - task: NuGetAuthenticate@1
    displayName: NuGet Authentication
    inputs:
      forceReinstallCredentialProvider: true
  - task: UseDotNet@2
    displayName: Setup .NET
    inputs:
      packageType: sdk
      version: 10.0.x

  - pwsh: |
      dotnet tool install --global minver-cli --version 5.0.0 `
        --configfile "build/pipelines/nuget.internal.config"
    displayName: Install minver-cli

  - pwsh: |
      nuget install Microsoft.CodeAnalysis.BinSkim -Version 4.4.9.9 -ConfigFile "build/pipelines/nuget.internal.config" -OutputDirectory binskim-pkg -ExcludeVersion -NonInteractive
      $exe = Get-ChildItem binskim-pkg -Filter BinSkim.exe -Recurse |
        Where-Object { $_.FullName -like '*win-x64*' } |
        Select-Object -First 1 -ExpandProperty FullName
      if (-not $exe) { throw 'BinSkim.exe not found in package' }
      Write-Host "##vso[task.setvariable variable=BINSKIM_EXE]$exe"
      Write-Host "BinSkim: $exe"
    displayName: Install BinSkim

  - pwsh: |
      $reason = '$(Build.Reason)'
      $sourceBranch = '$(Build.SourceBranch)'
      $manualVersion = '${{ parameters.version }}'

      if ($reason -eq 'Manual') {
        if ([string]::IsNullOrWhiteSpace($manualVersion)) {
          throw 'Manual run requires parameter "version".'
        }
        $version = $manualVersion.Trim()
      } else {
        $minver = Join-Path $env:USERPROFILE '.dotnet\tools\minver.exe'
        if (-not (Test-Path $minver)) {
          throw "minver not found at $minver"
        }

        # Keep parity with the original GitHub workflow MinVer settings.
        $version = (& $minver -t v -p experimental.0 -m 0.1).Trim()
      }

      if (-not $version) { throw 'Could not resolve version' }

      $isTag = $sourceBranch.StartsWith('refs/tags/v')
      $isPrerelease = $version.Contains('-')

      Write-Host "##vso[task.setvariable variable=PackageVersion]$version"
      Write-Host "##vso[task.setvariable variable=IsTag]$($isTag.ToString().ToLower())"
      Write-Host "##vso[task.setvariable variable=IsPrerelease]$($isPrerelease.ToString().ToLower())"
      Write-Host "Version: $version (reason=$reason, isTag=$isTag)"
    displayName: Resolve version

  - pwsh: |
      dotnet restore Reactor.slnx --configfile "build/pipelines/nuget.internal.config"
    displayName: Restore

  - pwsh: |
      dotnet build Reactor.slnx --no-restore --configuration Release
    displayName: Build framework + analyzers

  - pwsh: |
      dotnet pack src/Reactor/Reactor.csproj `
        --no-build --configuration Release `
        -p:Version=$(PackageVersion) `
        -o artifacts/nupkg
    displayName: Pack framework NuGet

  - pwsh: |
      dotnet pack tools/Templates/Microsoft.UI.Reactor.Templates.csproj `
        --no-build --configuration Release `
        -p:Version=$(PackageVersion) `
        -p:Platform=AnyCPU `
        -o artifacts/nupkg
    displayName: Pack Templates

  - pwsh: |
      dotnet publish src/Reactor.Cli/Reactor.Cli.csproj `
        --configuration Release `
        --runtime win-x64 `
        --self-contained false `
        -p:Version=$(PackageVersion) `
        -o artifacts/mur/x64
    displayName: Publish mur (win-x64)

  - pwsh: |
      dotnet publish src/Reactor.Cli/Reactor.Cli.csproj `
        --configuration Release `
        --runtime win-arm64 `
        --self-contained false `
        -p:Version=$(PackageVersion) `
        -o artifacts/mur/arm64
    displayName: Publish mur (win-arm64)

  - pwsh: |
      New-Item -ItemType Directory -Force -Path artifacts/binskim | Out-Null

      $managed = @()
      foreach ($dir in 'artifacts/mur/x64', 'artifacts/mur/arm64') {
        $managed += Get-ChildItem $dir -Recurse -File -Include '*.dll', '*.exe' |
          Where-Object { $_.FullName -notmatch '[\\/]runtimes[\\/]' } |
          Select-Object -ExpandProperty FullName
      }

      $packages = Get-ChildItem artifacts/nupkg -Filter *.nupkg -File |
        Select-Object -ExpandProperty FullName

      $targets = @($packages) + @($managed)
      Write-Host "BinSkim targets: $($packages.Count) nupkg, $($managed.Count) managed binaries"

      & "$(BINSKIM_EXE)" analyze @targets --output artifacts/binskim/binskim.sarif
      if ($LASTEXITCODE -ne 0) {
        throw "BinSkim reported policy violations (exit $LASTEXITCODE). See SARIF artifact."
      }
    displayName: Run BinSkim

  - task: PublishPipelineArtifact@1
    displayName: Upload BinSkim SARIF
    condition: always()
    inputs:
      targetPath: artifacts/binskim/binskim.sarif
      artifact: binskim-$(PackageVersion)

  - pwsh: |
      $version = '$(PackageVersion)'
      $stage = 'artifacts/kit-stage/reactor'

      New-Item -ItemType Directory -Force -Path $stage | Out-Null
      New-Item -ItemType Directory -Force -Path "$stage/bin/x64" | Out-Null
      New-Item -ItemType Directory -Force -Path "$stage/bin/arm64" | Out-Null

      Copy-Item SKILL.md $stage
      Copy-Item -Recurse skills $stage
      Copy-Item artifacts/mur/x64/* "$stage/bin/x64/" -Recurse
      Copy-Item artifacts/mur/arm64/* "$stage/bin/arm64/" -Recurse
      Copy-Item tools/install-skill-kit.ps1 "$stage/install-skill-kit.ps1"

      New-Item -ItemType Directory -Force -Path artifacts/kit | Out-Null
      $zip = "artifacts/kit/reactor-skill-kit-$version.zip"
      Compress-Archive -Path artifacts/kit-stage/reactor -DestinationPath $zip -Force

      Write-Host "Kit: $zip"
    displayName: Assemble skill kit

  - task: PublishPipelineArtifact@1
    displayName: Upload artifact
    inputs:
      targetPath: artifacts
      artifact: release-$(PackageVersion)

  # Optional: for tag builds, create GitHub release from ADO using gh CLI.
  # Requires secret variable GH_TOKEN with repo write scope.
  - pwsh: |
      if ([string]::IsNullOrWhiteSpace("$(GH_TOKEN)")) {
        Write-Host 'GH_TOKEN not set. Skipping GitHub Release creation.'
        exit 0
      }

      $version = '$(PackageVersion)'
      $tag = "$(Build.SourceBranchName)"
      $preFlag = ''
      if ('$(IsPrerelease)' -eq 'true') {
        $preFlag = '--prerelease'
      }

      $files = @()
      $files += Get-ChildItem artifacts/nupkg/*.nupkg -File | Select-Object -ExpandProperty FullName
      $files += Get-ChildItem artifacts/nupkg/*.snupkg -File | Select-Object -ExpandProperty FullName
      $files += Get-ChildItem artifacts/kit/*.zip -File | Select-Object -ExpandProperty FullName

      $notesPath = Join-Path $PWD 'artifacts/release-notes.md'
      @"
**Reactor $version**

> Interim distribution — see [spec 022](https://github.com/microsoft/microsoft-ui-reactor/blob/main/docs/specs/022-packaging-and-distribution.md) for the rollout plan.

## Two assets

### `Microsoft.UI.Reactor.$version.nupkg` — the framework

Drop into a folder and add a NuGet source pointing at it:

```xml
<!-- nuget.config -->
<configuration>
  <packageSources>
    <add key="reactor-local" value="C:\path\to\folder\with\nupkg" />
  </packageSources>
</configuration>
```

Then in your `.csproj`:

```xml
<PackageReference Include="Microsoft.UI.Reactor" Version="$version" />
```

### `reactor-skill-kit-$version.zip` — agent skill bundle + `mur` CLI

Extract, then run:

```powershell
cd reactor
.\install-skill-kit.ps1
```

Installs to `~/.claude/skills/reactor/` and adds `bin/<arch>` to your user PATH. After a new shell, `mur --version` should resolve.
"@ | Set-Content -Path $notesPath -Encoding UTF8

      $env:GH_TOKEN = '$(GH_TOKEN)'
      $cmd = @('release', 'create', $tag, '--repo', 'microsoft/microsoft-ui-reactor', '--title', "Reactor $version", '--generate-notes')
      $cmd += @('--notes-file', $notesPath)
      if ($preFlag) { $cmd += $preFlag }
      $cmd += $files

      & gh @cmd
      if ($LASTEXITCODE -ne 0) {
        throw "gh release create failed (exit $LASTEXITCODE)"
      }
    displayName: Create GitHub Release
    condition: and(succeeded(), eq(variables['IsTag'], 'true'))
