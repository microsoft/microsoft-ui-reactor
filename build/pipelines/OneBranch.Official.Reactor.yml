#################################################################################
#                               OneBranch Pipelines                             #
# Official OneBranch pipeline for Microsoft.UI.Reactor (CrossPlat, docked).      #
# Produces framework NuGet packages (Microsoft.UI.Reactor + Templates) and the  #
# reactor skill kit (mur x64 + arm64). Ports build/pipelines/ob-release.yml.     #
# Official builds run network-restricted: NuGet restore resolves from            #
# build/pipelines/nuget.internal.config (hydrated by tools/seed-artifacts-feed). #
# Documentation:  https://aka.ms/obpipelines                                    #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Retail Tasks:   https://aka.ms/obpipelines/tasks                              #
# Support:        https://aka.ms/onebranchsup                                   #
#################################################################################

trigger: none # https://aka.ms/obpipelines/triggers

parameters: # parameters are shown up in ADO UI in a build queue time
- name: 'debug'
  displayName: 'Enable debug output'
  type: boolean
  default: false
- name: 'version'
  displayName: 'Version to pack (manual runs only; e.g. 0.1.0-preview.1). Leave blank to use MinVer.'
  type: string
  default: ''

variables:
  CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)] # needed for onebranch.pipeline.version task https://aka.ms/obpipelines/versioning
  system.debug: ${{ parameters.debug }}

  # Mirror GitHub Actions' CI flag so dev-only nested builds stay off in the docked,
  # network-restricted container. Reactor.Cli's RunSignaturesGen target is gated on
  # '$(CI)' != 'true' and otherwise runs a nested `dotnet build` that does its OWN
  # restore against the default feed -> NU1301 when isolated. The committed
  # skills/reactor.api.txt is what pack consumes, so skipping regen in CI is correct.
  CI: true

  # Reactor builds the .slnx solution via the dotnet CLI (no dirs.proj / msbuild.exe).
  BuildSolution: $(Build.SourcesDirectory)\Reactor.slnx
  BuildConfiguration: Release
  # Official builds are network-restricted: restore must resolve from the internal feed.
  NuGetConfig: $(Build.SourcesDirectory)\build\pipelines\nuget.internal.config

  WindowsContainerImage: 'onebranch.azurecr.io/windows/ltsc2019/vse2022:latest' # must match agent host OS (ltsc2019/10.0.17763); .NET 10 SDK is installed at runtime via global.json

resources:
  repositories: 
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates # https://aka.ms/obpipelines/templates
  parameters:
    cloudvault: # https://aka.ms/obpipelines/cloudvault
      enabled: false
    globalSdl: # https://aka.ms/obpipelines/sdl
      asyncSdl:
        enabled: true
        tsaOptionsFile: .config/tsaoptions.json
      # tsa:
      #  enabled: false # onebranch publish all sdl results to TSA. If TSA is disabled all SDL tools will forced into 'break' build mode.
      # credscan:
      #   suppressionsFile: $(Build.SourcesDirectory)\.config\CredScanSuppressions.json
      policheck:
        break: true # always break the build on policheck issues. You can disable it by setting to 'false'
      # suppression:
      #   suppressionFile: $(Build.SourcesDirectory)\.gdn\global.gdnsuppress

    stages:
    - stage: build
      jobs:
      - job: main
        pool:
          type: windows  # read more about custom job pool types at https://aka.ms/obpipelines/yaml/jobs
        
        variables: # More settings at https://aka.ms/obpipelines/yaml/jobs
          ob_outputDirectory: '$(Build.SourcesDirectory)\out' # this directory is uploaded to pipeline artifacts, reddog and cloudvault. More info at https://aka.ms/obpipelines/artifacts
          ob_git_fetchDepth: -1 # full git history + tags so MinVer can derive the version (shallow clone => 0.1.0 fallback)
          # https://aka.ms/obpipelines/sdl
          ob_sdl_binskim_break: true # always break the build on binskim issues, even if TSA enabled. You can disable it by setting to 'false'
          ob_sdl_roslyn_break: true
          ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}: # conditionally enable symbolsPublishing for main branch only
            ob_symbolsPublishing_enabled: true # https://aka.ms/obpipelines/symbols
          # ob_sdl_suppression_suppressionFile: $(Build.SourcesDirectory)\.gdn\job.gdnsuppress

        steps:
          - template: /build/pipelines/templates/reactor-build-steps.yml@self
            parameters:
              outputDirectory: '$(Build.SourcesDirectory)\out'
              solution: '$(BuildSolution)'
              configuration: '$(BuildConfiguration)'
              nugetConfig: '$(NuGetConfig)'
              version: ${{ parameters.version }}
              runTests: false # selftests/E2E need a live WinUI window; not available in the docked container
              pack: true

          - task: onebranch.pipeline.signing@1
            displayName: 'Sign output'
            inputs:
              command: 'sign'
              signing_environment: 'azure-ado'
              files_to_sign: '**/*.exe;**/*.dll;**/*.nupkg;**/*.ps1;**/*.psm1'
              search_root: '$(Build.SourcesDirectory)\out'
# uncomment this section and edit parameters to enable VSTest instead of dotnet tests. When you enable this you dont need publish test results and codecoverage steps
         # - task: VSTest@3
         #   inputs:
          #    testSelector: 'testAssemblies'
           #   testAssemblyVer2: |
            #    **\*test*.dll
             #   !**\*TestAdapter.dll
              #  !**\obj\**
             # searchFolder: '$(Build.SourcesDirectory)\out' ## or use '$(Agent.BuildDirectory)'
              ##testFiltercriteria: 'TestCategory=UnitTests'   ## update
              #resultsFolder: '$(Build.SourcesDirectory)\out\logs\TestResults'
              #runInParallel: true ## this setting helps to speed up test case execution but if youhave depdencies between tests you change or remove this but having it enabled is always recommended
              #codeCoverageEnabled: true
              #testRunTitle: 'release_x64' ## Update this for a custom readable way of taggin your test run when you query in ADO test runs view
              #platform: 'x64' ## you can modify this as needed
              #configuration: 'release'
              #publishRunAttachments: false
              #failOnMinTestsNotRun: true
              #rerunFailedTests: true
              #rerunFailedThreshold: '70' 
