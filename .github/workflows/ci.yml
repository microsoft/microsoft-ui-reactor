name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      non-md: ${{ steps.filter.outputs.non-md }}
      docs-templates: ${{ steps.filter.outputs.docs-templates }}
      devtools-trim: ${{ steps.filter.outputs.devtools-trim }}
      audit-ledger: ${{ steps.filter.outputs.audit-ledger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect non-Markdown changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set +e
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            # Three-dot mirrors GitHub's PR diff (merge-base..head).
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            rc=$?
          elif [ -n "$PUSH_BEFORE" ] && [ -n "$PUSH_SHA" ] && [ "$PUSH_BEFORE" != "$ZERO_SHA" ]; then
            files=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA")
            rc=$?
          else
            echo "No valid diff range; defaulting all change filters to true"
            echo "non-md=true" >> "$GITHUB_OUTPUT"
            echo "docs-templates=true" >> "$GITHUB_OUTPUT"
            echo "devtools-trim=true" >> "$GITHUB_OUTPUT"
            echo "audit-ledger=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "git diff failed; defaulting all change filters to true"
            echo "non-md=true" >> "$GITHUB_OUTPUT"
            echo "docs-templates=true" >> "$GITHUB_OUTPUT"
            echo "devtools-trim=true" >> "$GITHUB_OUTPUT"
            echo "audit-ledger=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qv '\.md$'; then
            echo "non-md=true" >> "$GITHUB_OUTPUT"
          else
            echo "non-md=false" >> "$GITHUB_OUTPUT"
          fi
          # Spec 041 §5.2: tier-drift triggers when a template or doc-app
          # changes. Templates live under docs/_pipeline/templates/, apps
          # under docs/_pipeline/apps/, and the doc-pipeline CLI itself
          # under src/Reactor.Cli/Docs/.
          if echo "$files" | grep -qE '^(docs/_pipeline/templates/|docs/_pipeline/apps/|src/Reactor\.Cli/Docs/)'; then
            echo "docs-templates=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-templates=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(src/Reactor/Hosting/|src/Reactor\.Devtools/|tools/Reactor\.MstatVerifier/|tools/Reactor\.DevtoolsNegativeResolutionFixture/|samples/apps/hello-world-aot/|samples/apps/hello-world-aot-devtools-on/)'; then
            echo "devtools-trim=true" >> "$GITHUB_OUTPUT"
          else
            echo "devtools-trim=false" >> "$GITHUB_OUTPUT"
          fi
          # Issue #959: the spec 044 swallowed-error audit is a Markdown file
          # whose summary table is derived from its own rows and gated by
          # Reactor.Tests. An audit-only edit is pure .md, so it sets
          # non-md=false and would skip every test job above — skipping the one
          # gate that change type exists for. This output re-arms it.
          if echo "$files" | grep -qE '^docs/specs/044/swallowed-error-audit\.md$'; then
            echo "audit-ledger=true" >> "$GITHUB_OUTPUT"
          else
            echo "audit-ledger=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore tests/Reactor.Tests/Reactor.Tests.csproj -p:Platform=x64
          dotnet restore tests/Reactor.Advanced.Tests/Reactor.Advanced.Tests.csproj -p:Platform=x64
          dotnet restore tests/Reactor.SourceMap.Spike/Reactor.SourceMap.Spike.csproj -p:Platform=x64

      - name: Test (Reactor.Tests)
        # SkipSignaturesGen / SkipReactorApiGen disable the on-build regeneration of
        # skills/reactor.api.txt. Without them, building Reactor.Tests regenerates the
        # committed index in place (host arch == target arch on the x64 runner), so
        # Tooling.ApiIndexGeneratorTests.Index_IsUpToDate compares the freshly-written
        # file against itself and passes even when the checked-in index is stale. That
        # is exactly how a stale index reached main (only the internal nightly, which
        # gates the regen via -p:CI=true, caught it). Gating the regen off here makes
        # Index_IsUpToDate verify the committed copies against the live surface in PR CI.
        #
        # Kept as its own step (rather than chained with Reactor.Advanced.Tests in one
        # `run:` block) so a non-zero exit here fails the job. PowerShell surfaces only
        # the last command's exit code, so a chained failure would be masked whenever a
        # later command succeeds — that hid 14 Devtools failures from PR CI once.
        run: dotnet test tests/Reactor.Tests/Reactor.Tests.csproj --no-restore -p:Platform=x64 -p:SkipSignaturesGen=true -p:SkipReactorApiGen=true --hangdump --hangdump-timeout 180s --hangdump-type None

      - name: Test (Reactor.Advanced.Tests)
        # !cancelled() so this still runs when Reactor.Tests failed above — we want
        # the full failure picture from one CI run, not one-failure-at-a-time. The
        # job still fails because the Reactor.Tests step's non-zero exit stands.
        if: ${{ !cancelled() }}
        run: dotnet test tests/Reactor.Advanced.Tests/Reactor.Advanced.Tests.csproj --no-restore -p:Platform=x64 --hangdump --hangdump-timeout 180s --hangdump-type None

      - name: Test (Reactor.SourceMap.Spike)
        # Spec 010 — the ONLY suite that compiles with the source-map interceptor
        # generator enabled, so it is also the only gate proving the generator emits
        # code that actually binds (a generator that silently stopped applying would
        # leave Element.CallSite null everywhere else without failing anything).
        # Same !cancelled() rationale as the step above.
        if: ${{ !cancelled() }}
        run: dotnet test tests/Reactor.SourceMap.Spike/Reactor.SourceMap.Spike.csproj --no-restore -p:Platform=x64 --hangdump --hangdump-timeout 180s --hangdump-type None

  audit-ledger:
    name: Audit ledger gate
    needs: changes
    # Only when the audit doc changed *and* the full unit-test job was skipped
    # for being Markdown-only — otherwise unit-tests already ran these facts.
    if: needs.changes.outputs.audit-ledger == 'true' && needs.changes.outputs.non-md == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/Reactor.Tests/Reactor.Tests.csproj -p:Platform=x64

      - name: Test (swallowed-error audit ledger)
        run: dotnet test tests/Reactor.Tests/Reactor.Tests.csproj --no-restore -p:Platform=x64 -p:SkipSignaturesGen=true -p:SkipReactorApiGen=true --filter-class "*SwallowedErrorAudit*"

  integration-tests:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Reactor.slnx

      - name: Test
        run: dotnet test tests/Reactor.IntegrationTests/Reactor.IntegrationTests.csproj --no-restore

  selftests:
    name: Selftests
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    # The suite's own process budget (SelfTestBatch.DefaultSelfTestTimeoutSeconds) is deliberately
    # generous so that a healthy-but-slow run is never killed and blamed on an arbitrary fixture
    # (issue #988). This job-level cap is the outer backstop for a genuinely wedged runner, so it
    # must sit above that budget but well below the 360-minute default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/Reactor.SelfTests/Reactor.SelfTests.csproj -p:Platform=x64

      - name: Test
        run: dotnet test tests/Reactor.SelfTests/Reactor.SelfTests.csproj --no-restore -p:Platform=x64

  e2e-tests:
    name: E2E Tests (winapp ui)
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Install the `winapp` CLI (winapp ui drives the UIA automation that replaced
      # WinAppDriver/Appium). The action downloads it and adds it to PATH, which
      # WinAppUi.ResolveWinAppExe() picks up via its PATH fallback.
      - name: Setup winapp CLI
        uses: microsoft/setup-WinAppCli@b93bbddc1f7abc061ca0d3a8119e3a0c7dd71495 # v0.2

      # The E2E suite launches Reactor.AppTests.Host.exe and drives it cross-process.
      # The Host is a ProjectReference of the test project, so building the test
      # project (Debug/x64 — the path TestSession.FindHostExe expects) builds it too.
      - name: Build E2E tests + Host (Debug x64)
        run: dotnet build tests/Reactor.AppTests/Reactor.AppTests.csproj -c Debug -p:Platform=x64

      - name: Test
        # --results-directory pins the TRX under the workspace root so the gate below can find it.
        # Without it, `dotnet test <csproj>` drops results under the project dir
        # (tests/Reactor.AppTests/TestResults), where the repo-root TRX lookup never looks.
        # --report-trx is the Microsoft.Testing.Platform equivalent of the old
        # `--logger "trx;LogFileName=..."`; it needs Microsoft.Testing.Extensions.TrxReport,
        # which Reactor.AppTests references.
        run: dotnet test tests/Reactor.AppTests/Reactor.AppTests.csproj -c Debug -p:Platform=x64 --no-build --report-trx --report-trx-filename app-tests.trx --results-directory TestResults

      - name: Fail on skipped input-injection E2Es
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path TestResults -Filter app-tests.trx -Recurse | Select-Object -First 1
          if (-not $trx) {
            throw "AppTests TRX results were not produced."
          }

          $blocked = @()
          $results = Select-Xml -Path $trx.FullName -XPath "//*[local-name()='UnitTestResult' and (@outcome='Inconclusive' or @outcome='NotExecuted' or @outcome='Skipped')]"
          foreach ($result in $results) {
            $messageNode = $result.Node.SelectSingleNode("*[local-name()='Output']/*[local-name()='ErrorInfo']/*[local-name()='Message']")
            $message = if ($messageNode) { $messageNode.InnerText } else { "" }
            if ($message -match "cannot inject synthetic input|workstation is|locked desktop|disconnected session") {
              $blocked += $result.Node.GetAttribute("testName")
            }
          }

          if ($blocked.Count -gt 0) {
            throw "Input-injection E2Es were Inconclusive instead of executed: $($blocked -join ', ')"
          }

  build-solution:
    name: Build solution
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Reactor.slnx

      - name: Build
        run: dotnet build Reactor.slnx --no-restore --configuration Release

      - name: VSIX Tier A tests
        run: dotnet test src\vs-reactor\Tests\Reactor.VsExtension.Tests\Reactor.VsExtension.Tests.csproj -c Release --no-restore

      - name: VSIX Tier B SDK tests
        run: dotnet test src\vs-reactor\Tests\Reactor.VsExtension.SdkTests\Reactor.VsExtension.SdkTests.csproj -c Release --no-restore

      # Tier C E2E/manual smoke is intentionally not run in CI; see src/vs-reactor/TESTING.md.
      - name: Validate structural VSIX build
        run: dotnet build src\vs-reactor\Reactor.VsExtension\Reactor.VsExtension.csproj -c Debug --no-restore

  fuzz-smoke:
    name: Fuzz smoke
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Fuzz-free pass: walk the seed corpus once through both harness bodies.
      # Guards against harness rot (parser API drift, broken seed inputs) without
      # needing the libfuzzer-dotnet driver or SharpFuzz instrumentation tool in
      # the CI image. Using `dotnet run` keeps the invocation independent of the
      # TFM / RID / Platform output-path layout, which has changed twice already.
      - name: Smoke run
        run: dotnet run --project tests/Reactor.Fuzz/Reactor.Fuzz.csproj -c Release -p:Platform=x64 -- smoke

  vulnerable-packages:
    name: Vulnerable packages
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Reactor.slnx

      # Fail the build on transitive vulnerable packages at High/Critical
      # severity. `dotnet list package --vulnerable` exits 0 regardless of
      # findings (the table is text output), so we parse the severity column
      # ourselves. Matches `> Package … High` / `Critical` rows; Moderate/Low
      # surface as warnings only.
      #
      # Advisories owned by projects under `samples/` or `tests/` do NOT gate
      # the build (issue #607): those are demonstration / test code, not shipped
      # artifacts, so a transitive advisory pulled in by a sample or test must
      # not red-X unrelated PRs. We still scan the whole solution in one pass,
      # then drop findings whose owning project is a sample/test. The excluded
      # set is derived from Reactor.slnx so it stays correct as projects move.
      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          # Project names (the .csproj file stems) under samples/ or tests/.
          # `dotnet list package` headers each block with this name, so we use
          # it to attribute findings back to their owning project.
          [xml]$sln = Get-Content -Raw Reactor.slnx
          $excluded = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($p in $sln.SelectNodes('//Project')) {
            $path = $p.GetAttribute('Path')
            if ([string]::IsNullOrWhiteSpace($path)) { continue }
            $norm = $path -replace '\\', '/'
            if ($norm -match '^(samples|tests)/') {
              [void]$excluded.Add([System.IO.Path]::GetFileNameWithoutExtension($norm))
            }
          }
          Write-Host "Excluding $($excluded.Count) sample/test project(s) from the vulnerability gate."

          $output = (dotnet list Reactor.slnx package --vulnerable --include-transitive 2>&1 | Out-String)
          $listExit = $LASTEXITCODE
          Write-Host $output
          # If the tool itself failed (restore error, NU* error, broken sdk),
          # we cannot trust the empty-findings result — fail loudly rather
          # than silently green-light the gate.
          if ($listExit -ne 0) {
            Write-Error "dotnet list package --vulnerable failed (exit $listExit). Cannot verify vulnerability status."
            exit $listExit
          }

          # Walk the output line by line, tracking the project that owns each
          # block (`The given project `Name` has …`). Only High/Critical rows
          # belonging to a non-excluded (shipped) project gate the build.
          $bad = [System.Collections.Generic.List[string]]::new()
          $skipped = [System.Collections.Generic.HashSet[string]]::new()
          $current = $null
          $currentExcluded = $false
          foreach ($line in ($output -split "`r?`n")) {
            if ($line -match '^The given project `([^`]+)` has') {
              $current = $Matches[1]
              $currentExcluded = $excluded.Contains($current)
              continue
            }
            if ($line -match '^\s*>\s+\S+' -and $line -match '\b(High|Critical)\b') {
              # Only count a project as "skipped" when it actually owns a
              # High/Critical row, so the log below never claims advisories
              # that don't exist (e.g. an excluded project with only Moderate).
              if ($currentExcluded) {
                [void]$skipped.Add($current)
                continue
              }
              [void]$bad.Add(("[{0}] {1}" -f $current, $line.Trim()))
            }
          }

          if ($skipped.Count -gt 0) {
            Write-Host "Ignored High/Critical advisories in non-shipped sample/test project(s): $($skipped -join ', ')"
          }
          if ($bad.Count -gt 0) {
            Write-Error "High or Critical vulnerable package(s) detected in shipped projects:`n$($bad -join "`n")"
            exit 1
          }
          Write-Host "No High/Critical vulnerable packages in shipped projects."

  aot-selftests:
    name: AOT Selftests
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Publish the selftest host with NativeAOT. PublishAotInternal=true,
      # Platform=x64, and rid=win-x64 are the canonical knobs documented in
      # docs/aot-support.md and used by tests/Reactor.AppTests.Host/probe-aot-skips.ps1.
      # `-o` pins the publish folder so the run step doesn't depend on the
      # default TFM/RID/Platform path layout.
      - name: Publish AOT host
        run: >
          dotnet publish tests/Reactor.AppTests.Host
          -p:PublishAotInternal=true
          -p:Platform=x64
          -r win-x64
          -c Release
          -o ${{ runner.temp }}/aot-publish
          --nologo

      # Run the published exe directly (not via `dotnet test`) so we exercise
      # the NativeAOT binary. SelfTestRunner.DefaultAotSkipPatterns gates the
      # known-failing fixtures (16 entries: PropertyGrid auto-discovery, three
      # Devtools fixtures — `fire`'s handler lookup, `state`'s hook read, and
      # DependencyProperty discovery for `properties`/`setProperty` — Issue142
      # XAML metadata, hot-reload state migration, and the UseObservableTree
      # property walk); any *new* failure surfaces as exit code 1 and fails the job.
      # See docs/aot-support.md for the skip-list debugging workflow.
      - name: Run AOT selftests
        shell: pwsh
        run: |
          $exe = Join-Path '${{ runner.temp }}/aot-publish' 'Reactor.AppTests.Host.exe'
          if (-not (Test-Path $exe)) {
            Write-Error "AOT-published host not found at $exe"
            exit 1
          }
          & $exe --self-test 2>&1 | Tee-Object -FilePath aot-selftest-output.tap
          exit $LASTEXITCODE

      - name: Upload TAP output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aot-selftest-tap
          path: aot-selftest-output.tap
          if-no-files-found: ignore

  aot-trim-proof:
    name: AOT Trim Proof
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Spec 048 §13.2 — AOT/trim proof. Publishes the minimal Hello-World
      # app (TextBlock + Button only) with NativeAOT, then asserts the
      # produced binary does NOT contain symbols that lazy registration
      # was supposed to leave dead (MarqueeControl/MarqueeHandler in
      # Phase 2; expanded to built-ins in Phase 3).
      # See tests/aot_trim_proof/README.md for the local runbook.
      - name: Publish AOT Hello-World
        run: >
          dotnet publish tests/aot_trim_proof/Reactor.AotHelloWorld
          -p:PublishAotInternal=true
          -p:Platform=x64
          -r win-x64
          -c Release
          -o ${{ runner.temp }}/aot-hello-world
          --nologo

      - name: Run trim assertions
        shell: pwsh
        env:
          REACTOR_AOT_PUBLISH_DIR: ${{ runner.temp }}/aot-hello-world
        run: |
          dotnet test tests/aot_trim_proof/Reactor.AotHelloWorld.TrimAssertions `
            --no-banner

      - name: Publish AOT Hello-World Advanced negative
        run: >
          dotnet publish tests/aot_trim_proof/Reactor.AotHelloWorld.Advanced
          -p:PublishAotInternal=true
          -p:Platform=x64
          -r win-x64
          -c Release
          -o ${{ runner.temp }}/aot-hello-world-advanced
          --nologo

      - name: Run Advanced negative trim assertions
        shell: pwsh
        env:
          REACTOR_AOT_ADVANCED_PUBLISH_DIR: ${{ runner.temp }}/aot-hello-world-advanced
        run: |
          dotnet test tests/aot_trim_proof/Reactor.AotHelloWorld.Advanced.TrimAssertions `
            --no-banner

      - name: Publish AOT Hello-World Advanced positive
        run: >
          dotnet publish tests/aot_trim_proof/Reactor.AotHelloWorld.Advanced.Positive
          -p:PublishAotInternal=true
          -p:Platform=x64
          -r win-x64
          -c Release
          -o ${{ runner.temp }}/aot-hello-world-advanced-positive
          --nologo

      - name: Run Advanced positive trim assertions
        shell: pwsh
        env:
          REACTOR_AOT_ADVANCED_POSITIVE_PUBLISH_DIR: ${{ runner.temp }}/aot-hello-world-advanced-positive
        run: |
          dotnet test tests/aot_trim_proof/Reactor.AotHelloWorld.Advanced.Positive.TrimAssertions `
            --no-banner

      - name: Upload published binary on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aot-hello-world-publish
          path: ${{ runner.temp }}/aot-hello-world
          if-no-files-found: ignore

  devtools-trim-mstat:
    name: Devtools trim mstat
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.devtools-trim == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build Reactor framework
        run: dotnet build src\Reactor\Reactor.csproj -p:Platform=x64 -c Release --nologo

      - name: Verify Reactor.dll has no devtools implementation IL
        shell: pwsh
        run: |
          $reactorDll = Get-ChildItem src\Reactor\bin -Recurse -Filter Reactor.dll |
            Where-Object { $_.FullName -like '*\Release\*' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $reactorDll) {
            Write-Error "No built Reactor.dll found."
            exit 1
          }
          dotnet run --project tools\Reactor.MstatVerifier\Reactor.MstatVerifier.csproj -c Release -- reactor-il $reactorDll.FullName

      - name: Verify devtools implementation types require package reference
        run: >
          dotnet run --project tools\Reactor.MstatVerifier\Reactor.MstatVerifier.csproj -c Release --
          negative-resolution tools\Reactor.DevtoolsNegativeResolutionFixture\Reactor.DevtoolsNegativeResolutionFixture.csproj

      - name: Publish switch-off app
        run: >
          dotnet publish samples/apps/hello-world-aot/HelloWorldAot.csproj
          -p:PublishAotInternal=true
          -p:Platform=x64
          -r win-x64
          -c Release
          -o ${{ runner.temp }}/hello-world-aot-off
          --nologo

      - name: Verify switch-off mstat
        shell: pwsh
        run: |
          $mstat = Get-ChildItem samples\apps\hello-world-aot\obj -Recurse -Filter *.mstat |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $mstat) {
            Write-Error "No switch-off mstat file found."
            exit 1
          }
          $exe = Join-Path '${{ runner.temp }}/hello-world-aot-off' 'hello-world-aot.exe'
          dotnet run --project tools\Reactor.MstatVerifier\Reactor.MstatVerifier.csproj -c Release -- absence $mstat.FullName $exe

      - name: Publish switch-on positive control
        run: >
          dotnet publish samples/apps/hello-world-aot-devtools-on/HelloWorldAotDevtoolsOn.csproj
          -p:PublishAotInternal=true
          -p:Platform=x64
          -r win-x64
          -c Release
          -o ${{ runner.temp }}/hello-world-aot-devtools-on
          --nologo

      - name: Verify switch-on mstat
        shell: pwsh
        run: |
          $mstat = Get-ChildItem samples\apps\hello-world-aot-devtools-on\obj -Recurse -Filter *.mstat |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $mstat) {
            Write-Error "No switch-on mstat file found."
            exit 1
          }
          $exe = Join-Path '${{ runner.temp }}/hello-world-aot-devtools-on' 'hello-world-aot-devtools-on.exe'
          dotnet run --project tools\Reactor.MstatVerifier\Reactor.MstatVerifier.csproj -c Release -- presence $mstat.FullName $exe

  docs-check-tier:
    name: Docs tier-drift
    needs: changes
    if: needs.changes.outputs.docs-templates == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Spec 041 §5.2 — fast tier-drift gate. Fails when a template's
      # declared tier no longer matches the §11 structural checklist. The
      # narrower `check-tier` surface runs in ~seconds vs. the full
      # `docs compile` (no build, capture, diagrams, or reference-gen).
      # `--ci` is not yet flipped on: the existing 24 W001
      # winui-ref-not-declared warnings are intentional noise on
      # internals/meta pages and are being addressed separately as a
      # Phase 5 lint-quality item. Errors (REACTOR_DOC_TIER_001..012)
      # still fail the job. See docs/contributing/doc-pipeline.md §8.
      - name: Tier-lint
        run: dotnet run --project src/Reactor.Cli -- docs check-tier

  docs-snippet-gate:
    name: Doc snippet analyzer gate
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore docs/_pipeline/apps/DocApps.proj -p:Platform=x64

      # Every `snippet=` block in docs/guide/ is extracted verbatim from a doc app
      # under docs/_pipeline/apps/, so a doc app IS the code we tell users to write.
      # Two gaps let 276 analyzer diagnostics reach the published guides:
      #
      #   1. Only win2d-canvas was listed in Reactor.slnx, so the other 52 doc apps
      #      were never compiled by CI at all.
      #   2. A ProjectReference to src/Reactor does not flow Reactor.Analyzers —
      #      it ships as a packed <None Pack="true"> item — so even that one app
      #      compiled without the rules its own readers are subject to.
      #
      # Directory.Build.props now wires the consumer analyzer bundle in, and this
      # job builds every app through it. The failure mode being prevented is a
      # snippet that compiles yet warns (hard-coded colours), or worse, silently
      # does nothing the surrounding prose claims (REACTOR_MOD_003 inert modifiers,
      # REACTOR_HOOKS_001 conditional hooks).
      #
      # Warnings are promoted with MSBuild's own mechanism so the build itself fails on a
      # diagnostic -- the scan below only turns that into readable annotations. Relying on the
      # scan alone would make the gate depend on MSBuild's output text, which is not a contract.
      # NU1900 ("Error occurred while getting package vulnerability data") is exempted rather than
      # NoWarn'd, because NoWarn would replace each project's own list instead of adding to it.
      - name: Build doc apps with consumer analyzers
        shell: pwsh
        run: |
          $log = dotnet build docs/_pipeline/apps/DocApps.proj -c Debug -p:Platform=x64 --no-restore -v:minimal -nologo -p:TreatWarningsAsErrors=true -p:WarningsNotAsErrors=NU1900 2>&1
          $log | ForEach-Object { $_.ToString() }
          $exit = $LASTEXITCODE

          # Case-sensitive: an insensitive match also hits the restore's
          # "warning NU1900: Error occurred while getting package vulnerability
          # data", which would make this gate fail for reasons unrelated to docs.
          # MSBuild prints each diagnostic twice (inline + summary), hence -Unique.
          $diags = $log |
            Select-String ': (warning|error) REACTOR_' -CaseSensitive |
            ForEach-Object { ($_.Line -replace '\s*\[[^\]]*\]\s*$', '').Trim() } |
            Sort-Object -Unique

          if ($diags.Count -gt 0) {
            Write-Host "::error::$($diags.Count) Reactor analyzer diagnostic(s) in doc-app snippets."
            $diags | ForEach-Object { Write-Host "::error::$_" }
            Write-Host ''
            Write-Host 'These snippets are extracted verbatim into docs/guide/, so every one of'
            Write-Host 'these warns in a reader''s project too. Fix them at the source in'
            Write-Host 'docs/_pipeline/apps/<topic>/App.cs -- do not add NoWarn or #pragma.'
            exit 1
          }

          if ($exit -ne 0) { throw "Doc apps failed to build (exit $exit)." }
          Write-Host "OK: all doc apps built clean under the consumer analyzer bundle."

  docs-build:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Compile docs
        run: dotnet run --project src/Reactor.Cli -- docs compile --no-screenshots --ci

      # Non-destructiveness gate for issue #989: a compile with
      # --no-screenshots must never touch a committed screenshot. Phase 3 is
      # the pipeline's only binary writer, and this proves — on a real runner,
      # via the real invocation, on every PR — that skipping it leaves
      # docs/guide/images alone. The compile above is the subject; this step is
      # only the assertion, so it genuinely can come out either way (it fails
      # if anyone reintroduces a write on the skip path).
      #
      # Scope note: this watches the whole directory, which is broader than the
      # guarantee it defends. Phase 5.5 (diagrams) also writes there — *.svg
      # copies and .mmd.sha256 sidecars — and is not skipped by
      # --no-screenshots. Keep it broad on purpose: narrowing to *.png to match
      # the screenshot guarantee would stop it noticing a diagram write that
      # appears on the skip path, and an unexpected write is the signal here
      # regardless of which phase produced it. The failure message therefore
      # reports what changed instead of naming a cause it cannot know.
      #
      # `git status --porcelain`, not `git diff`: diff sees tracked
      # modifications only. A capture emitting a *new* PNG (new topic, renamed
      # asset) leaves an untracked file that diff reports as nothing at all —
      # and the near-miss this gate exists for reached the index through
      # `git add -A`, which stages precisely those. Verified by planting each
      # case against this command: tracked overwrite and untracked create both
      # produce output; a clean tree produces none.
      #
      # `--untracked-files=all` is for the *message*, not the verdict: the
      # default (normal) collapses a wholly-new directory to `?? path/dir/`,
      # which is still non-empty output, so the gate fires either way. Measured
      # both modes against a planted subdirectory — `all` names each PNG, so
      # whoever hits this in CI sees which files appeared instead of a
      # directory they then have to go and inspect.
      - name: Verify --no-screenshots left committed images untouched
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $dirty = git status --porcelain --untracked-files=all -- docs/guide/images
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git status failed (exit $LASTEXITCODE) — the gate could not run, so treat this as a failure rather than an all-clear."
            exit 1
          }
          if ($dirty) {
            $dirty | ForEach-Object { Write-Host "  $_" }
            Write-Error 'docs compile --no-screenshots added, modified or deleted the files listed above under docs/guide/images. That path must be non-destructive on the skip path: capture (Phase 3) does not run, so no screenshot may be written. A .png here means a capture write was reintroduced; a .svg or .mmd.sha256 means Phase 5.5 (diagrams) wrote — that phase is not skipped by this flag, so check whether the source diagram or its committed copy drifted. See issue #989 and docs/contributing/doc-pipeline.md section 4.'
            exit 1
          }

      # Docs version freshness gate. The compile above substitutes the
      # {{reactorVersion}} token — whose single source is <ReactorPublicVersion>
      # in Directory.Build.props — into the guide pages that name the package
      # version. If a PR bumps that property (or edits these templates) without
      # recompiling, the committed output goes stale; fail here with a clear fix
      # instead of shipping docs that disagree with the source of truth.
      #
      # Scoped to the two version-bearing pages (getting-started, packaging)
      # rather than all of docs/guide: other committed guide pages currently
      # carry pre-existing compile drift unrelated to versioning, which a
      # whole-tree diff would false-fail on. Widen once that drift is
      # reconciled separately.
      - name: Verify docs version substitution is committed
        shell: pwsh
        run: |
          # git diff --exit-code returns non-zero when the tree differs; opt out
          # of native-command error mapping so we surface the actionable message
          # below instead of a bare PowerShell terminating error.
          $PSNativeCommandUseErrorActionPreference = $false
          git diff --exit-code -- docs/guide/getting-started.md docs/guide/packaging.md
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'docs/guide is out of date with the doc templates and/or ReactorPublicVersion. Run: dotnet run --project src/Reactor.Cli -- docs compile --no-screenshots  then commit the regenerated docs/guide pages (the {{reactorVersion}} token is substituted from <ReactorPublicVersion> in Directory.Build.props).'
            exit 1
          }

      # tests/Reactor.DocPipeline.Tests is in Reactor.slnx but ran in no
      # workflow, so every assertion in it was a gate that could not fail.
      # It covers the doc-pipeline internals this job exercises (template
      # compilation, image processing, the blank-screenshot gate), so it
      # belongs here rather than in the WinUI unit-test job.
      - name: Doc-pipeline tests
        run: dotnet test tests/Reactor.DocPipeline.Tests/Reactor.DocPipeline.Tests.csproj -p:Platform=x64 --no-banner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      # Strict link/anchor check against the docs just compiled above,
      # mirroring the Pages publish workflow (.github/workflows/docs.yml).
      # `--strict` turns a broken cross-link or missing nav file into a
      # failure, so it fails the PR instead of the post-merge publish (the
      # only place --strict ran before). Folded into this job so there is a
      # single docs build.
      - name: mkdocs build --strict
        run: python -m mkdocs build --strict
