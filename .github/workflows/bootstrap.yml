name: Bootstrap

# Exercises bootstrap.ps1 end-to-end on a fresh windows-latest runner to
# validate the source-checkout developer flow (`git clone` → `bootstrap.ps1`
# → `dotnet new reactor`). The script is invoked non-interactively via
# `-InstallWinAppSdk -SkipPlugin`, which also exercises the winget install
# path for the Windows App Runtime when the runner image doesn't already
# have it.

on:
  pull_request:
    paths:
      - 'bootstrap.ps1'
      - 'tools/BootstrapFeedResolver.ps1'
      # Default-on for src/, rather than an allowlist of package inputs.
      #
      # The scaffolded TestApp is built and launched by this job's packaged
      # smoke against the source-built 0.0.0-local packages. Its inputs are
      # wider than they look: the template references Microsoft.UI.Reactor and
      # Microsoft.UI.Reactor.Devtools, Devtools project-references
      # Reactor.Advanced, and Reactor.csproj packs six more projects into the
      # package consumers compile against (Analyzers, Analyzers.Internal, the
      # Localization/Wrappers/SourceMap generators, Wrappers.Abstractions).
      # That is 10 of the 14 projects under src/, and an allowlist of them
      # drifts silently every time one is added — a miss shows up as a
      # packaged regression nobody caught, not as a red build.
      #
      # So: include src/ and subtract the four that cannot affect the
      # scaffolded app. Negations are order-sensitive and must stay last.
      #
      # Narrower than "packaged testing" in general: ci.yml's Packaged Selftests
      # already run the in-repo host under MSIX identity on every non-md change.
      # What only this job covers is the *scaffolded template* path — a fresh
      # app from the external template pack, built against local packages.
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/bootstrap.yml'
      - '!src/Reactor.Compile.Analyzer/**'
      - '!src/Reactor.Interop.WinForms/**'
      - '!src/vs-reactor/**'
      - '!src/vscode-reactor/**'
      # Nothing markdown should spin a 12-minute bootstrap. A PR touching both
      # a .cs and a .md under src/ still matches on the .cs and runs.
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'bootstrap.ps1'
      - 'tools/BootstrapFeedResolver.ps1'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/bootstrap.yml'
      - '!src/Reactor.Compile.Analyzer/**'
      - '!src/Reactor.Interop.WinForms/**'
      - '!src/vs-reactor/**'
      - '!src/vscode-reactor/**'
      - '!**/*.md'
  workflow_dispatch:

# Cancel in-progress runs against the same ref when a new push arrives.
concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bootstrap:
    name: bootstrap.ps1 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NOTE: deliberately *not* running actions/setup-dotnet here. We want
      # bootstrap.ps1 to detect the SDK situation on the runner and, if
      # necessary, winget-install .NET 10 itself. If the runner image
      # already has 10.x the install branch is a silent no-op and we
      # still exercise the rest of the pipeline.

      - name: Pre-flight — show toolchain baseline
        shell: pwsh
        run: |
          # Diagnostic-only step. Reset $LASTEXITCODE on exit so a non-zero
          # winget status (which is common — "not installed" returns
          # -1978335166) doesn't fail the workflow before bootstrap.ps1 even
          # starts.
          Write-Host "=== dotnet --list-sdks ==="
          if (Get-Command dotnet -ErrorAction SilentlyContinue) {
              dotnet --list-sdks
          } else {
              Write-Host "(dotnet not on PATH)"
          }
          Write-Host ""
          Write-Host "=== winget --version ==="
          winget --version
          Write-Host ""
          Write-Host "=== Windows App Runtime (winget list) ==="
          # --accept-source-agreements: a fresh runner hasn't accepted the
          # msstore source terms. Without it, winget prompts and fails on a
          # non-interactive shell.
          #
          # The id comes from the same helper bootstrap.ps1 uses, so this
          # diagnostic cannot report a different package than the one bootstrap
          # actually checks.
          . ./tools/WindowsAppRuntimeId.ps1
          $sdk = Get-PinnedWindowsAppSdkVersion -PropsPath ./Directory.Build.props
          $wartId = Get-WindowsAppRuntimeWingetId $sdk
          Write-Host "WindowsAppSDKVersion=$sdk -> $wartId"
          if ($wartId) { winget list --id $wartId --exact --accept-source-agreements 2>&1 }
          Write-Host "exit=$LASTEXITCODE"
          $global:LASTEXITCODE = 0

      - name: Run bootstrap.ps1 (non-interactive)
        shell: pwsh
        run: |
          ./bootstrap.ps1 -InstallWinAppSdk -SkipPlugin
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 exited $LASTEXITCODE" }

      - name: Verify mur resolves from a fresh shell
        shell: pwsh
        run: |
          # A new step gets a fresh process with its own $env:Path snapshot.
          # `dotnet tool install -g` updates the *User* PATH, which fresh
          # processes pick up at start. If GH Actions doesn't propagate that
          # (varies by image), prepend defensively.
          $toolsDir = Join-Path $env:USERPROFILE '.dotnet\tools'
          if (-not (($env:Path -split ';') -contains $toolsDir)) {
              $env:Path = "$toolsDir;$env:Path"
          }
          $cmd = Get-Command mur -ErrorAction SilentlyContinue
          if (-not $cmd) { throw "mur is not resolvable on PATH after bootstrap" }
          Write-Host "mur resolved at: $($cmd.Source)"
          mur --version
          if ($LASTEXITCODE -ne 0) { throw "mur --version exited $LASTEXITCODE" }

      - name: Run mur doctor (must report all checks PASS / info-only)
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          mur doctor
          if ($LASTEXITCODE -ne 0) { throw "mur doctor failed (exit $LASTEXITCODE)" }

      # Regression guard: `mur check` loads Roslyn at runtime, and a
      # PrivateAssets="all" reference once excluded Microsoft.CodeAnalysis*.dll
      # from the packed tools/ payload. The assemblies were still in bin/, so
      # `dotnet run` worked while every *installed* `mur check` threw
      # FileNotFoundException at startup — invisible to every check above,
      # which only exercise commands that don't touch Roslyn.
      #
      # --list-rules is the cheapest command that forces the load: it resolves
      # the rule registry and exits without running a build.
      - name: Verify installed mur check loads Roslyn
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          $out = mur check --list-rules 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
              Write-Host $out
              throw "mur check --list-rules exited $LASTEXITCODE"
          }
          # Exit 0 alone is not proof: assert the registry actually rendered.
          # A rule name that vanishes is a real signal, not a formatting nit.
          if ($out -notmatch 'GridSizePxRenameRule') {
              Write-Host $out
              throw "mur check --list-rules did not list the expected ruleset"
          }
          Write-Host $out

      - name: Verify local-nupkgs/ produced
        shell: pwsh
        run: |
          $expected = @(
              'local-nupkgs/Microsoft.UI.Reactor.0.0.0-local.nupkg',
              'local-nupkgs/Microsoft.UI.Reactor.Cli.1.0.0.nupkg'
          )
          $missing = @()
          foreach ($p in $expected) {
              if (Test-Path $p) {
                  $size = (Get-Item $p).Length
                  Write-Host "  [ok] $p ($size bytes)"
              } else {
                  Write-Host "  [missing] $p" -ForegroundColor Red
                  # Microsoft.UI.Reactor.Cli is versioned from MinVer/etc and
                  # may not match the literal "1.0.0" filename. Don't fail on
                  # it specifically — just on the two 0.0.0-local nupkgs.
                  if ($p -notlike '*Microsoft.UI.Reactor.Cli*') { $missing += $p }
              }
          }
          if ($missing.Count -gt 0) { throw "Missing nupkgs: $($missing -join ', ')" }
          # Sanity: at least one *.Cli.*.nupkg under local-nupkgs/.
          $cliPkgs = @(Get-ChildItem local-nupkgs -Filter 'Microsoft.UI.Reactor.Cli.*.nupkg')
          if ($cliPkgs.Count -eq 0) { throw "No Microsoft.UI.Reactor.Cli.*.nupkg found in local-nupkgs/" }
          Write-Host "  [ok] CLI tool nupkg: $($cliPkgs[0].Name)"

      - name: Verify dotnet new reactor templates registered
        shell: pwsh
        run: |
          # Reactor's app templates ship in the Windows App SDK `dotnet new`
          # pack, which bootstrap.ps1 §5 installs via `winapp new --list`.
          $listing = dotnet new list reactor 2>&1
          $rc = $LASTEXITCODE
          Write-Host $listing
          if ($rc -ne 0) { throw "dotnet new list reactor exited $rc" }
          # `dotnet new list` writes a multi-line table; PowerShell stores the
          # output as a [string[]]. -match / -notmatch against an array filter
          # element-wise, so `-notmatch 'reactor'` returns the non-matching
          # lines (header, separator) which evaluates truthy even when the
          # template is present. Join + match to do a whole-output substring
          # check instead.
          $joined = $listing -join "`n"
          # The "not found" message repeats the search term and prints a
          # `dotnet new search reactor` hint, both of which contain `reactor` as
          # a whole token — so the token match below reports success precisely
          # when the template is absent. Check the negative marker first, exactly
          # as InterpretTemplateListOutput does.
          if ($joined -match 'No templates found') {
              throw "``dotnet new list reactor`` found no templates"
          }
          # Match each short name as a whole token. A plain substring check (or a
          # \b regex) also matches `reactor-mvu` and `winui-reactor`, because '-'
          # is a word boundary — so a pack carrying only the richer shells would
          # pass the `reactor` probe. Short names are comma-separated inside a
          # whitespace-delimited column, so require one of those on each side.
          # Case-sensitive on purpose: the Template Name column carries the
          # capitalised prose word ("Reactor MVU App"), which is a standalone
          # token and would satisfy a case-insensitive match on its own.
          foreach ($shortName in @('reactor', 'reactor-mvu', 'reactor-navview', 'reactor-tabview')) {
              $token = '(?<![^\s,])' + [regex]::Escape($shortName) + '(?![^\s,])'
              if (-not [regex]::IsMatch($joined, $token)) {
                  throw "$shortName template not found in ``dotnet new list reactor`` output"
              }
              Write-Host "  [ok] $shortName"
          }
          # The pack itself must be the Windows App SDK one. Match the id as a
          # whole line, not a substring: a longer id that merely contains ours
          # (`...CSharp.Templates.Extras`) would otherwise satisfy this while the
          # required pack is absent — the same prefix false-positive
          # WinAppSdkTemplates.InterpretPackageInstalledOutput guards against.
          $packageLines = (dotnet new uninstall 2>&1 | Out-String) -split "`r?`n" | ForEach-Object { $_.Trim() }
          if ($packageLines -notcontains 'Microsoft.WindowsAppSDK.WinUI.CSharp.Templates') {
              throw "Microsoft.WindowsAppSDK.WinUI.CSharp.Templates is not installed"
          }
          Write-Host "  [ok] Microsoft.WindowsAppSDK.WinUI.CSharp.Templates registered"
          # The in-repo Microsoft.UI.Reactor.ProjectTemplates pack was deleted.
          # Nothing may resurrect it: a stray install would hand new developers
          # the unpackaged `reactorapp` template the docs no longer describe.
          if ($packageLines -contains 'Microsoft.UI.Reactor.ProjectTemplates') {
              throw "the removed Microsoft.UI.Reactor.ProjectTemplates pack is installed; it should no longer exist"
          }
          Write-Host "  [ok] removed Microsoft.UI.Reactor.ProjectTemplates not installed"

      - name: Scaffold a TestApp and restore against the local feed
        shell: pwsh
        run: |
          # Inside the repo so the root nuget.config (which maps local-nupkgs/)
          # is picked up by NuGet's parent-dir walk.
          New-Item -ItemType Directory -Path TestProjects | Out-Null
          # The scaffolded TestApp lives under the repo, so MSBuild's and NuGet's
          # parent-dir walks would otherwise apply the repo's own build rules to
          # what is meant to be an end-user scaffold. Both walks stop at the first
          # file they find, so shadowing them here isolates the app — which is
          # what a real scaffold outside the repo gets.
          #
          #   Directory.Packages.props — the root one flips the app into Central
          #     Package Management, conflicting with the template's inline
          #     PackageReference versions (NU1008).
          #   Directory.Build.props/.targets — the root pair sets
          #     IsAotCompatible=true and promotes IL trim warnings to hard errors.
          #     A packaged Release build runs ILLink, and CsWinRT's generated ABI
          #     code emits IL2081 by design, so the app fails to build with 36
          #     errors and NETSDK1144. Outside the repo those stay warnings.
          Set-Content -Path TestProjects/Directory.Packages.props -Value '<Project><PropertyGroup><ManagePackageVersionsCentrally>false</ManagePackageVersionsCentrally></PropertyGroup></Project>'
          Set-Content -Path TestProjects/Directory.Build.props -Value '<Project />'
          Set-Content -Path TestProjects/Directory.Build.targets -Value '<Project />'
          Push-Location TestProjects
          try {
              # Bootstrap validates the local 0.0.0-local feed produced by
              # mur pack-local. The template's normal default may point at a
              # not-yet-published public preview while a release-prep PR is in
              # flight, so opt into the local package version explicitly here
              dotnet new reactor -n TestApp --reactor-version 0.0.0-local
              if ($LASTEXITCODE -ne 0) { throw "dotnet new reactor exited $LASTEXITCODE" }
              if (-not (Test-Path 'TestApp/TestApp.csproj')) { throw "TestApp/TestApp.csproj not produced" }

              dotnet restore TestApp/TestApp.csproj --nologo -v:m
              if ($LASTEXITCODE -ne 0) { throw "dotnet restore for TestApp exited $LASTEXITCODE" }
          } finally {
              Pop-Location
          }

      - name: Build TestApp (packaged single-project MSIX)
        shell: pwsh
        run: |
          # The Windows App SDK Reactor templates scaffold a *packaged*
          # (single-project MSIX) app, which requires a concrete architecture —
          # AnyCPU is rejected. Pass the host arch explicitly.
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          dotnet build TestProjects/TestApp/TestApp.csproj `
              -c Release `
              "-p:Platform=$arch" `
              --nologo -v:m
          if ($LASTEXITCODE -ne 0) { throw "TestApp build exited $LASTEXITCODE" }

      # A packaged app can build cleanly and still fail to register or activate,
      # and "scaffolded apps are now packaged" is the central behaviour change in
      # this migration — so building is not end-to-end coverage. The integration
      # test this PR deleted did scaffold→`dotnet run`→UIA against the *unpackaged*
      # `reactorapp` template; this is its packaged replacement, asserting the two
      # things the build cannot: the loose layout registers, and the app activates.
      #
      # Registering an unsigned loose MSIX layout requires Developer Mode. GitHub's
      # windows runners are administrators, so the AppModelUnlock switch is settable
      # directly — same approach as the Packaged Selftests job in ci.yml.
      - name: Enable Developer Mode
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense `
            -PropertyType DWord -Value 1 -Force | Out-Null
          $v = (Get-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense).AllowDevelopmentWithoutDevLicense
          if ($v -ne 1) { throw "Developer Mode is not enabled (AllowDevelopmentWithoutDevLicense=$v)." }

      - name: Launch TestApp (packaged registration + activation)
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          $job = $null
          $proc = $null
          Push-Location TestProjects/TestApp
          try {
              # `dotnet run` on a single-project MSIX registers a loose-layout
              # package and activates it. It does not return while the app is up,
              # so run it as a job and poll.
              $job = Start-Job -ScriptBlock {
                  param($dir, $arch)
                  Set-Location $dir
                  dotnet run -c Release "-p:Platform=$arch" --nologo 2>&1
              } -ArgumentList (Get-Location).Path, $arch

              for ($i = 0; $i -lt 90; $i++) {
                  Start-Sleep -Seconds 2
                  $proc = Get-Process -Name 'TestApp' -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($proc) { break }
                  if ($job.State -eq 'Completed' -or $job.State -eq 'Failed') { break }
              }

              # The Reactor manifest's Identity/@Name is a generated GUID, not the
              # project name, so `Get-AppxPackage -Name TestApp` finds nothing even
              # on a perfectly successful activation. Read the identity the
              # template actually emitted.
              [xml]$manifest = Get-Content 'Package.appxmanifest' -Raw
              $identity = $manifest.Package.Identity.Name
              Write-Host "  package identity: $identity"
              $pkg = Get-AppxPackage -Name $identity -ErrorAction SilentlyContinue

              if (-not $proc) {
                  Write-Host '--- dotnet run output ---'
                  Receive-Job $job 2>&1 | Write-Host
                  throw 'TestApp never started — the packaged app built but did not register/activate.'
              }

              Write-Host "  [ok] TestApp activated (pid $($proc.Id))"
              if ($pkg) { Write-Host "  [ok] registered package $($pkg.PackageFullName)" }
              else { throw "TestApp is running but no loose-layout package is registered for identity '$identity'." }

              # A process that starts and a package that registers do not prove the
              # Reactor UI rendered — an app can come up in Reactor's render-error
              # fallback with a broken App.cs or package reference and still satisfy
              # both. The deleted CreateTemplateTests caught that by asserting a UIA
              # element; this is the packaged equivalent. The blank template renders
              # `TitleBar("$projectname$")`, so a TitleBar named TestApp is present
              # exactly when the scaffold rendered.
              # Resolve winapp the same way bootstrap's Get-WinAppCliPath does:
              # winget's MSIX install drops an app-execution alias that exists on
              # disk without always being resolvable through this process's PATH,
              # so a bare `winapp` can fail on exactly that installation state.
              $winApp = (Get-Command winapp -ErrorAction SilentlyContinue).Source
              if (-not $winApp) {
                  $alias = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\winapp.exe'
                  if (Test-Path $alias) { $winApp = $alias }
              }
              if (-not $winApp) { throw 'winapp CLI not found, so the rendered-UI assertion cannot run.' }

              $rendered = $false
              for ($i = 0; $i -lt 20; $i++) {
                  $hit = & $winApp ui search 'TestApp' --window $proc.MainWindowHandle --json 2>&1 | Out-String
                  if ($LASTEXITCODE -eq 0 -and $hit -match 'TestApp') { $rendered = $true; break }
                  Start-Sleep -Seconds 3
                  $proc.Refresh()
              }
              if (-not $rendered) {
                  Write-Host '--- UI tree ---'
                  & $winApp ui inspect --app TestApp 2>&1 | Write-Host
                  throw 'TestApp activated but its Reactor UI did not render (no element named TestApp in the tree).'
              }
              Write-Host '  [ok] Reactor UI rendered (TitleBar present)'
          } finally {
              # Every throw above leaves a live packaged app and a blocked
              # `dotnet run` job behind. Tear them down here, not on the success
              # path only: a leaked TestApp contaminates the idempotence steps that
              # follow, and a leaked job can leave the runner waiting on it.
              if ($proc) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
              if ($job) {
                  Stop-Job $job -ErrorAction SilentlyContinue
                  Remove-Job $job -Force -ErrorAction SilentlyContinue
              }
              Pop-Location
          }

      - name: Verify mur upgrade is idempotent
        shell: pwsh
        run: |
          # `mur upgrade` should succeed against an already-bootstrapped tree:
          # re-pack, ensure the `dotnet new reactor` templates are installed,
          # refresh plugin.
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          mur upgrade --skip-plugin
          if ($LASTEXITCODE -ne 0) { throw "mur upgrade exited $LASTEXITCODE" }

      - name: Re-run bootstrap.ps1 (idempotence check)
        shell: pwsh
        run: |
          # Re-running on the same machine should be a clean no-op for any
          # already-correct piece (winget detects already-installed runtimes,
          # dotnet tool update is a no-op when up to date, etc.).
          ./bootstrap.ps1 -InstallWinAppSdk -SkipPlugin
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 re-run exited $LASTEXITCODE" }
