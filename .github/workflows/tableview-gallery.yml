name: TableView Gallery Self-Test

# On-demand (NOT part of the every-PR build). Exercises the native C++/WinRT
# TableView gallery (separate-binary Microsoft.UI.Xaml.Controls.Advanced.dll,
# projected to C# against public WinAppSDK) integrated into Reactor.TestApp's
# "TableView" tab. The gallery is gated behind -p:IncludeTableView=true so the
# shared every-PR CI (which builds Reactor.slnx without the flag) is unaffected;
# this workflow opts in and asserts the gallery builds + (best-effort) renders.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "samples/Reactor.TestApp/Demos/TableViewDemo.cs"
      - "samples/Reactor.TestApp/AdvancedStyles/**"
      - "samples/Reactor.TestApp/TableViewStrings/**"
      - "samples/Reactor.TestApp/app.manifest"
      - "samples/Reactor.TestApp/tableview-gallery-selftest.ps1"
      - "samples/TableViewSamples.Embedded/**"
      - "samples/TableView.Projection/**"
      - ".github/workflows/tableview-gallery.yml"

permissions:
  contents: read

jobs:
  tableview-gallery-selftest:
    name: TableView-in-Reactor gallery self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Build + self-test the TableView gallery (IncludeTableView=true)
        shell: pwsh
        run: ./samples/Reactor.TestApp/tableview-gallery-selftest.ps1 -Configuration Release -Platform x64
