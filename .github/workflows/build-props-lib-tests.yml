# Headless tests for the repo's dependency on GitHub.Copilot.SDK's MSBuild
# contract (tests/build_props/ci/CopilotSdkContract.Tests.ps1): the reviewed SDK
# version, and the CI-only CopilotSkipCliDownload default in Directory.Build.props.
#
# This workflow exists because nothing else can catch that contract breaking. The
# ordinary matrix runs with the native CLI download already skipped, so it stays
# green if an SDK bump renames the property or the $(CI) block is deleted. The
# suite evaluates Directory.Build.props directly, needing no network, restore, or
# credentials, and pins the reviewed SDK version so a bump fails here until the
# SDK's targets have been re-read. `dotnet msbuild` on a bare non-SDK project is
# the only build work involved, so it is a seconds-long job. Exits non-zero on
# any failed assertion.
name: Build props tests

on:
  push:
    paths:
      - 'Directory.Build.props'
      # A GitHub.Copilot.SDK version bump can change or drop the MSBuild contract
      # Directory.Build.props depends on, and no other job would notice.
      - 'Directory.Packages.props'
      - 'tests/build_props/ci/**'
      - '.github/workflows/build-props-lib-tests.yml'
  pull_request:
    paths:
      - 'Directory.Build.props'
      # A GitHub.Copilot.SDK version bump can change or drop the MSBuild contract
      # Directory.Build.props depends on, and no other job would notice.
      - 'Directory.Packages.props'
      - 'tests/build_props/ci/**'
      - '.github/workflows/build-props-lib-tests.yml'

permissions:
  contents: read

jobs:
  copilot-sdk-contract:
    name: Copilot SDK contract tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The suite clears CI and CopilotSkipCliDownload itself before each case, so
      # the runner's own CI=true cannot decide a result.
      - name: Run Copilot SDK contract tests
        shell: pwsh
        run: ./tests/build_props/ci/CopilotSdkContract.Tests.ps1
