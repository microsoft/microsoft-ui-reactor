name: TableView Demo Self-Test

# On-demand (not on every PR) — exercises samples/apps/tableview-demo, which hosts
# the native C++/WinRT TableView (separate-binary Microsoft.UI.Xaml.Controls.Advanced.dll,
# projected to C# against public WinAppSDK 2.0.1) inside a Reactor app. The self-test
# asserts the native control activates inside the Reactor mount path.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "samples/apps/tableview-demo/**"
      - ".github/workflows/tableview-demo.yml"

permissions:
  contents: read

jobs:
  tableview-demo-selftest:
    name: TableView-in-Reactor self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Run TableView-in-Reactor self-test
        shell: pwsh
        run: ./samples/apps/tableview-demo/selftest.ps1 -Configuration Release -Platform x64
