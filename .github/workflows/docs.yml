name: Publish docs

# The site is built with Blume (docs/_website). docs/_website/scripts/publish.mjs
# renders each version once into its own folder on the `gh-pages` branch, and
# the Pages artifact is that whole branch, so versions stay byte-identical after
# they are published. Releases published before the move to Blume stay there as
# the MkDocs sites they were. The `versions.json` at the site root keeps the
# format mike wrote, so those older sites' version selector still reads it, and
# Blume's version menu reads the same file.
on:
  push:
    branches: [main]
    paths:
      - 'docs/guide/**'
      - 'docs/_website/**'
      - 'docs/_site-root/**'
      # The site's /changelog pages are built from it.
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
    # Path filters are not evaluated for tag pushes, so a release tag always
    # publishes regardless of which files the release commit touched. That is
    # the behaviour we want here: the tag itself is the trigger.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      backfill_tags:
        description: >-
          Space-separated release tags to publish retroactively, e.g.
          "v0.1.0-preview.12 v0.1.0-preview.13". Leave empty to just republish
          the selected branch as the `main` version.
        required: false
        default: ''
      handoff_versions:
        description: >-
          Set by a release-tag run, which publishes to gh-pages but hands the
          Pages deployment to main (see the handoff job). Space-separated
          versions already on gh-pages that this run must deploy and verify,
          e.g. "0.1.0-preview.18". Can also be set by hand when re-serving a
          release, so verify probes that version's directory too.
        required: false
        default: ''
      handoff_from:
        description: >-
          Set by a release-tag run: the URL of the run that handed its
          deployment here. Informational only.
        required: false
        default: ''

permissions: {}

# Serialises Pages deployments *and* the gh-pages pushes below, so two runs can
# never race for the same branch.
#
# `queue: max` is load-bearing, not a tidiness knob. The default (`single`)
# keeps at most one *pending* run per group and cancels the previous one when a
# new run queues. During a release that is reachable and costly: the merge's
# `main` run holds the group, the release tag's run waits behind it, and any
# further docs push to `main` would evict the tag run before it ever ran. The
# release version would then never be written to gh-pages at all, and nothing
# would fail. Queuing makes the tag run wait its turn instead (FIFO, up to 100
# pending).
#
# `cancel-in-progress` is deliberately absent: it defaults to false, and
# `queue: max` with `cancel-in-progress: true` is a workflow validation error.
#
# The run a release tag hands its deployment to (see the handoff job) joins this
# group too, behind the tag run that dispatched it. That is why the tag run
# cannot wait for it: the tag run holds the group until its last job finishes,
# so waiting would deadlock.
concurrency:
  group: pages
  queue: max

env:
  PAGES_BRANCH: gh-pages
  LATEST_ALIAS: latest
  MAIN_VERSION: main
  # Every publishing step appends the version it wrote to
  # "$RUNNER_TEMP/$PUBLISHED_VERSIONS_FILE", and the artifact step turns that
  # into a job output. The verify job probes exactly these directories: probing
  # only the `latest` holder would skip a backported tag (which deliberately
  # does not move `latest`) and skip `main` on a branch push, so a broken new
  # directory could pass on the strength of its versions.json entry alone.
  # Held as a bare filename because workflow-level env cannot expand
  # $RUNNER_TEMP; every use joins the two.
  PUBLISHED_VERSIONS_FILE: published-versions.txt
  # The branch every Pages deployment is made from. A release-tag run hands its
  # deployment to a run dispatched here rather than deploying from the tag (see
  # the handoff job). It must be a branch: a tag-ref deployment is exactly the
  # one Pages drops.
  PAGES_DEPLOY_REF: main

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      # The exact version list the verify job must find on the live site, and
      # the subset this run actually wrote (plus any a release-tag run handed
      # off to it). See the artifact step for why each exists. The handoff job
      # also passes `published` on, as the versions the run it dispatches must
      # verify.
      versions: ${{ steps.artifact.outputs.versions }}
      published: ${{ steps.artifact.outputs.published }}
      # The attempt that produced the artifact. `github.run_attempt` read in
      # the verify job would be wrong: re-running only the failed `deploy` job
      # reuses this artifact, so its attempt legitimately trails the re-run's.
      run_attempt: ${{ steps.artifact.outputs.run_attempt }}
    permissions:
      contents: write # scripts/publish.mjs commits the rendered site to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish steps commit on top of the gh-pages history, and decide
          # which release is `latest` by sorting the tag list — both need real
          # history.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/_website's engines floor; Blume does not run on older Node.
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: docs/_website/package-lock.json

      - name: Install the site builder
        working-directory: docs/_website
        run: npm ci

      - name: Configure the identity gh-pages commits are made under
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check out the existing version history
        # A second worktree, so the publish steps write into gh-pages while this
        # checkout stays on the ref being published. The branch is absent only
        # on the very first run; anything else that stops git reading it fails
        # here, because starting an empty branch over an existing one would
        # only fail later, at the push.
        run: |
          pages="$RUNNER_TEMP/pages"
          status=0
          git ls-remote --exit-code --heads origin "$PAGES_BRANCH" >/dev/null || status=$?
          case "$status" in
            0)
              git fetch origin "$PAGES_BRANCH:$PAGES_BRANCH"
              git worktree add "$pages" "$PAGES_BRANCH"
              ;;
            2)
              echo "No $PAGES_BRANCH branch yet — starting an empty one."
              git worktree add --orphan -b "$PAGES_BRANCH" "$pages"
              ;;
            *)
              echo "::error::Could not read $PAGES_BRANCH from origin (git ls-remote exited $status)."
              exit "$status"
              ;;
          esac
          echo "PAGES_DIR=$pages" >> "$GITHUB_ENV"

      # The publish steps build strictly as well. This adds what a build does
      # not run, the publisher's own tests and Blume's content validation,
      # before anything is written to gh-pages. Mirrors the PR-side gate in
      # ci.yml.
      - name: Check the docs strictly
        working-directory: docs/_website
        run: |
          npm run smoke
          node scripts/sync.mjs
          npm run validate

      - name: Publish the main version
        if: github.ref_type == 'branch' && !inputs.backfill_tags
        working-directory: docs/_website
        run: |
          # Until a release holds `latest` there is nothing else for the site
          # root to redirect to, so publish.mjs points it at main for that
          # window; publishing any release moves it to `latest`.
          node scripts/publish.mjs --pages "$PAGES_DIR" --version "$MAIN_VERSION" --push
          echo "$MAIN_VERSION" >> "$RUNNER_TEMP/$PUBLISHED_VERSIONS_FILE"

      - name: Publish the release version
        # `!inputs.backfill_tags` matters because a workflow_dispatch can be
        # started from a tag ref: without it, a manual backfill launched from a
        # tag would run this step and the backfill step in the same run.
        if: github.ref_type == 'tag' && !inputs.backfill_tags
        working-directory: docs/_website
        run: |
          version="${GITHUB_REF_NAME#v}"
          # versionsort.suffix ranks v0.1.0 above v0.1.0-preview.N and -rc.N,
          # matching publish.mjs. Plain v:refname puts the release last.
          newest="$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | head -n 1)"

          if [ "$GITHUB_REF_NAME" = "$newest" ]; then
            # Also builds /latest/ and points the site root at it.
            node scripts/publish.mjs --pages "$PAGES_DIR" --version "$version" --latest --push
          else
            # Tagging an older line (a backport, or a re-cut of a superseded
            # tag) must publish that version without dragging `latest` backwards.
            echo "$GITHUB_REF_NAME is older than $newest — publishing without moving $LATEST_ALIAS."
            node scripts/publish.mjs --pages "$PAGES_DIR" --version "$version" --push
          fi

          # Recorded only after the version has actually been pushed, so the
          # list the verify job probes never claims something that was not
          # published.
          echo "$version" >> "$RUNNER_TEMP/$PUBLISHED_VERSIONS_FILE"

      - name: Backfill release versions
        if: inputs.backfill_tags
        working-directory: docs/_website
        env:
          BACKFILL_TAGS: ${{ inputs.backfill_tags }}
        run: |
          # A typo'd or missing-`v` tag must fail before anything is published:
          # the loop below pushes as it goes, so discovering a bad tag halfway
          # would leave the site half-updated.
          for tag in $BACKFILL_TAGS; do
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::backfill_tags: '$tag' is not a tag in this repository. Use full release tags, including the leading v — for example v0.1.0-preview.14."
              exit 1
            fi
            if ! git cat-file -e "$tag:docs/guide" 2>/dev/null; then
              echo "::error::backfill_tags: '$tag' has no docs/guide folder to build."
              exit 1
            fi
          done

          # Each tag's docs/guide is checked out beside this checkout and built
          # with this ref's publish script and site config: tags cut before the
          # move to Blume have no docs/_website. --lenient lets a tag's page set
          # differ from this ref's nav.json (a missing page is a warning, an
          # extra one lands in a "More" group) and builds without Blume's strict
          # mode, since the tag's links were checked when it shipped.
          newest="$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | head -n 1)"

          for tag in $BACKFILL_TAGS; do
            echo "::group::Publishing $tag"
            checkout="$RUNNER_TEMP/tags/$tag"
            git worktree add --detach "$checkout" "$tag"

            if [ "$tag" = "$newest" ]; then
              node scripts/publish.mjs --pages "$PAGES_DIR" --version "${tag#v}" --latest \
                --guide "$checkout/docs/guide" --ref "$tag" --lenient --push
            else
              node scripts/publish.mjs --pages "$PAGES_DIR" --version "${tag#v}" \
                --guide "$checkout/docs/guide" --ref "$tag" --lenient --push
            fi
            echo "${tag#v}" >> "$RUNNER_TEMP/$PUBLISHED_VERSIONS_FILE"

            git worktree remove --force "$checkout"
            echo "::endgroup::"
          done

          # No separate step for the site root: every publish rewrites it to
          # `latest` once a release holds that alias, else main, else the newest
          # published release, so it never 404s.

      - name: Adopt the versions a release-tag run handed off
        # A release-tag run writes its version to gh-pages but does not deploy
        # it (see the handoff job); it dispatches this workflow on
        # PAGES_DEPLOY_REF and names what it wrote. Recording those versions
        # here is what makes verify probe their directories on the live site.
        # Without it this run would only prove `main`, and a broken release
        # directory could pass on the strength of its versions.json entry. The
        # artifact step fails the run if any of them is missing from gh-pages.
        if: inputs.handoff_versions
        env:
          HANDOFF_VERSIONS: ${{ inputs.handoff_versions }}
          HANDOFF_FROM: ${{ inputs.handoff_from }}
        run: |
          echo "Deploying versions handed off by ${HANDOFF_FROM:-a manual dispatch}: $HANDOFF_VERSIONS"
          # `read -a` rather than an unquoted loop: it splits on whitespace
          # without glob-expanding a stray `*` against the workspace.
          read -r -a handed_off <<< "$HANDOFF_VERSIONS"
          printf '%s\n' "${handed_off[@]}" >> "$RUNNER_TEMP/$PUBLISHED_VERSIONS_FILE"

      - name: Assemble the Pages artifact from every published version
        id: artifact
        # `git archive` rather than a checkout: it materialises the branch
        # without leaving git metadata in the directory that gets uploaded.
        run: |
          rm -rf site && mkdir site
          git archive "$PAGES_BRANCH" | tar -x -C site

          # Forwards legacy unversioned URLs to the same page under `latest`.
          # Kept out of gh-pages deliberately: it is a property of how the
          # site is served, not of any one published version, so it is refreshed
          # from this ref on every deploy. It is tracked in the repo, so a
          # missing file means something is wrong rather than absent by choice.
          cp docs/_site-root/404.html site/404.html

          # scripts/publish.mjs rewrites the root index.html on every publish,
          # so a missing one means no publish step reached gh-pages. Without it
          # the site root would 404, which is worth catching here rather than in
          # a bug report.
          if [ ! -f site/index.html ]; then
            echo "::error::The assembled site has no root index.html, so the site root would 404. Every publish step runs scripts/publish.mjs, which writes it; check that one ran."
            exit 1
          fi

          echo "Publishing these versions:"
          cat site/versions.json

          # Stamps the artifact with the run that produced it, so the verify job
          # can tell *this* deployment from any other one serving the same site.
          #
          # Comparing versions.json alone would be vacuous for a main push:
          # republishing main leaves the version set unchanged, so the
          # comparison passes whether or not this run's deployment ever landed.
          # The run id is what makes the check mean something on every trigger.
          #
          # Written here rather than committed to gh-pages for the same reason
          # 404.html is: it is a property of a deployment, not of a published
          # version. Named without a leading `.` or `_` deliberately — Pages has
          # historically excluded those, and an unservable stamp would fail
          # every run.
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{run_id: $run_id, run_attempt: $run_attempt, run_url: $run_url, sha: $sha, ref: $ref, published_at: $published_at}' \
            > site/deploy-stamp.json
          cat site/deploy-stamp.json

          # Compact, because a job output is a single line.
          echo "versions=$(jq -c . site/versions.json)" >> "$GITHUB_OUTPUT"

          # The versions this run actually wrote, plus any a release-tag run
          # handed off to it, for the verify job to probe.
          # Every trigger path publishes at least one (main push, release tag,
          # or backfill), so an empty list means a publishing step stopped
          # recording and the gate would quietly fall back to probing only the
          # `latest` holder. Fail instead of verifying less than we think.
          published_file="$RUNNER_TEMP/$PUBLISHED_VERSIONS_FILE"
          if [ ! -s "$published_file" ]; then
            echo "::error::No publishing step recorded a version in $published_file, so the verify job cannot know what to probe. Every trigger path must append the version it published."
            exit 1
          fi

          published="$(jq -R -s -c 'split("\n") | map(select(length > 0)) | unique' < "$published_file")"

          # The two lists are produced independently — one by the publishing
          # steps, one by scripts/publish.mjs in versions.json — so a divergence
          # means the run does not actually know what it published. Fail here
          # rather than letting the verify job quietly probe fewer directories
          # than it should.
          missing="$(jq -c --argjson published "$published" \
            '(map(.version)) as $known | $published - $known' site/versions.json)"
          if [ "$missing" != "[]" ]; then
            echo "::error::These versions were recorded as published (or handed off by a release-tag run) but are absent from site/versions.json: $missing. The recorded list and versions.json disagree, so the verify job cannot be trusted to probe the right directories."
            exit 1
          fi

          echo "This run published: $published"
          echo "published=$published" >> "$GITHUB_OUTPUT"

          # Exported so verify compares against the attempt that built these
          # bytes. `run_id` alone is stable across re-runs, so a full "Re-run
          # all jobs" would republish under the same identity and a stranded
          # deployment could still match the previous attempt's live artifact.
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # Blume writes each version's agent catalog under `.well-known/`,
          # which the action leaves out by default.
          include-hidden-files: true

  deploy:
    needs: publish
    # Never from a tag. GitHub Pages accepts a deployment made from a tag ref
    # for a commit it is already serving, reports it successful (the
    # Deployments API even marks it active), and keeps serving the previous
    # artifact (issue #1268, actions/deploy-pages#383). A release tag always
    # points at the merge commit the `main` push just deployed, so its own
    # deployment was dropped on every release from 0.1.0-preview.16 to .18.
    # One came 14 minutes after the `main` run, so it is not a race. A
    # same-commit deployment from `main` went live within seconds each time.
    #
    # So a tag run publishes to gh-pages and the handoff job below hands the
    # deployment to `main`. The two conditions are exact complements: every
    # run either deploys (and is verified) or hands off.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Verify the live deployment
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    permissions:
      # Only to check out the verifier script. The job then reads a public site
      # over HTTPS and writes nothing.
      contents: read
    # Comfortably above the poll window below, so a hung request surfaces as a
    # timeout on this job rather than an open-ended run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'

      # `deploy` reporting success is not evidence that the site serves what
      # this run built: Pages has accepted and reported deployments it never
      # served (issue #1268). This is the only step in the pipeline that looks
      # at the live site, so it is the only one that can catch that, whatever
      # the cause.
      - name: Assert the live site is serving this run's artifact
        env:
          DOCS_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          DOCS_EXPECTED_RUN_ID: ${{ github.run_id }}
          DOCS_EXPECTED_RUN_ATTEMPT: ${{ needs.publish.outputs.run_attempt }}
          DOCS_EXPECTED_VERSIONS: ${{ needs.publish.outputs.versions }}
          DOCS_PUBLISHED_VERSIONS: ${{ needs.publish.outputs.published }}
          DOCS_VERIFY_TIMEOUT_SECONDS: '600'
          DOCS_VERIFY_INTERVAL_SECONDS: '15'
        run: node .github/scripts/verify-docs-deployment.mjs

  handoff:
    name: Hand the deployment to main
    needs: publish
    # The complement of `deploy`'s condition; see there for why a tag run must
    # not deploy. By the time this runs, `publish` has already written this
    # tag's version to gh-pages, so the dispatched run (which assembles its
    # artifact from the whole branch) serves it, and verifies the versions
    # named below on the live site.
    #
    # Nothing here predicts whether some other run will deploy. The handoff is
    # unconditional, the run it creates queues behind this one in the `pages`
    # group and so always finds this version on gh-pages, and a refused
    # dispatch fails this job. `queue: max` still cancels a run that arrives at
    # a full queue (100 pending), so the step also checks that the dispatched
    # run was admitted rather than trusting the API's acceptance. This run does
    # not wait for it to *finish*: see the concurrency block for why it cannot.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatches this workflow on PAGES_DEPLOY_REF
    steps:
      - name: Dispatch Publish docs on main to deploy and verify this release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          # Assigned on its own so `bash -e` sees a jq failure; inside another
          # command's arguments it would be swallowed.
          versions="$(jq -er 'if type == "array" and length > 0 and all(type == "string")
            then join(" ") else error("publish recorded no versions: \(.)") end' <<< "${PUBLISHED:-null}")"

          # The file this run started from, so a rename cannot leave the
          # dispatch pointing at a workflow that no longer exists. Cut at
          # `@refs/` rather than the last `@`, which a tag name may contain.
          workflow="${GITHUB_WORKFLOW_REF%%@refs/*}"
          workflow="${workflow##*/}"
          from="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"

          request="$(jq -n --arg ref "$PAGES_DEPLOY_REF" --arg versions "$versions" --arg from "$from" \
            '{ref: $ref, inputs: {handoff_versions: $versions, handoff_from: $from}, return_run_details: true}')"
          echo "Dispatching $workflow on $PAGES_DEPLOY_REF: $request"

          # A refused dispatch (permissions, an input the target ref's workflow
          # does not declare) exits non-zero and fails this job, so the release
          # cannot quietly go unserved.
          response="$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" --input - <<< "$request")"

          run_url="$(jq -r '.html_url // empty' <<< "$response")"
          run_id="$(jq -r '.workflow_run_id // empty' <<< "$response")"
          if [ -z "$run_url" ] || [ -z "$run_id" ]; then
            # The dispatch was accepted; only the link and the admission check
            # below are missing.
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/$workflow?query=event%3Aworkflow_dispatch"
            echo "::warning::The dispatch was accepted but GitHub returned no run details, so its admission to the pages queue is unchecked. Find the run in $run_url."
          else
            # This run holds the `pages` group, so a healthy dispatched run
            # waits behind it and cannot finish yet. Finishing anyway means it
            # never got in: cancelled at a full queue, or a startup failure.
            for _ in $(seq 1 9); do
              sleep 5
              state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '"\(.status) \(.conclusion // "")"')" \
                || state="unreadable "
              if [ "${state%% *}" = completed ]; then
                echo "::error::The dispatched run $run_url ended before it could deploy (${state#* }), so $versions is on $PAGES_BRANCH but not being served. Dispatch Publish docs on $PAGES_DEPLOY_REF with handoff_versions set to '$versions'."
                exit 1
              fi
            done
            echo "Dispatched run $run_id is waiting its turn ($state)."
          fi

          echo "::notice title=Deployment handed to $PAGES_DEPLOY_REF::$run_url deploys and verifies $versions. Its verify job, not this run, says whether the release is live."
          {
            echo "### Deployment handed to \`$PAGES_DEPLOY_REF\`"
            echo
            echo "This tag run published \`$versions\` to \`$PAGES_BRANCH\` but does not deploy from a tag ref (issue #1268)."
            echo "[The run it dispatched]($run_url) deploys from \`$PAGES_DEPLOY_REF\` and verifies the live site: check its \`verify\` job."
          } >> "$GITHUB_STEP_SUMMARY"
