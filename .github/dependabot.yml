version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    # Wait 7 days after a release before proposing it, so the community has a
    # window to detect and report a compromised action release.
    cooldown:
      default-days: 7

  # NuGet version updates run on Dependabot's Linux hosts, which cannot restore
  # this repo's Windows-only project graph (WinUI / WindowsAppSDK apps, and even
  # plain net10.0 projects like src/Reactor.Cli). Packages referenced ONLY by
  # those projects (e.g. GitHub.Copilot.SDK, YamlDotNet) are therefore backfilled
  # by .github/workflows/windows-nuget-updates.yml on a windows-latest runner.
  # Dependabot still owns every Linux-restorable package.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "nuget"
    open-pull-requests-limit: 10
    # Grouping is deliberately limited to package sets that NuGet itself forces
    # to move together (exact-pin `[x, x]` dependencies or floors that advance
    # every release). Families that merely share a prefix are left ungrouped, so
    # an unrelated bump still gets its own reviewable PR.
    groups:
      # Roslyn ships Microsoft.CodeAnalysis.* as one version-locked set:
      # Microsoft.CodeAnalysis.CSharp.Workspaces 5.6.0 exact-pins
      # Microsoft.CodeAnalysis.CSharp [5.6.0, 5.6.0] and
      # Microsoft.CodeAnalysis.Common [5.6.0, 5.6.0], and each Roslyn release
      # raises its floor on Microsoft.CodeAnalysis.Analyzers (5.9.0 requires
      # >= 5.9.0-1.26328.17). Updating them one package per PR breaks restore
      # with NU1608 "Detected package version outside of dependency constraint",
      # which is an error here because Release treats warnings as errors. This
      # has already happened twice: #814 merged with CSharp.Workspaces stranded
      # a version behind, and #1113 repeated it. Group them so a Roslyn bump
      # always moves the whole set in a single PR.
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis*"
        # The analyzer/code-fix test harness ships from dotnet/roslyn-sdk on an
        # independent 1.1.x line, so it must not be dragged into a 5.x bump.
        exclude-patterns:
          - "Microsoft.CodeAnalysis*Testing"

      # The roslyn-sdk test harness is its own version-locked set, one line down:
      # Microsoft.CodeAnalysis.CSharp.CodeFix.Testing 1.1.4 exact-pins
      # Microsoft.CodeAnalysis.CodeFix.Testing [1.1.4, 1.1.4], which in turn
      # exact-pins Microsoft.CodeAnalysis.Analyzer.Testing [1.1.4, 1.1.4] — the
      # same package Microsoft.CodeAnalysis.CSharp.Analyzer.Testing 1.1.4 pins.
      # Bumping one without the other reproduces the NU1608 above on the 1.1.x
      # line, so they get their own group rather than joining `roslyn`.
      roslyn-testing:
        patterns:
          - "Microsoft.CodeAnalysis*Testing"
    ignore:
      # Windows App SDK and Win2D are pinned via Directory.Build.props
      # (WindowsAppSDKVersion / WindowsAppSDKWinUIVersion / Win2DVersion) and bumped
      # intentionally, in lockstep across the metapackage and the individually-
      # referenced sub-packages. Kept in sync with the --exclude list in
      # .github/workflows/windows-nuget-updates.yml.
      - dependency-name: "Microsoft.WindowsAppSDK"
      - dependency-name: "Microsoft.WindowsAppSDK.WinUI"
      - dependency-name: "Microsoft.WindowsAppSDK.Runtime"
      - dependency-name: "Microsoft.Graphics.Win2D"
      # MessagePack is a transitive dependency (Microsoft.VisualStudio.SDK ->
      # StreamJsonRpc) pinned in Directory.Packages.props to the 2.x line for
      # StreamJsonRpc compatibility, at >= 2.5.301 for the GHSA-hv8m-jj95-wg3x
      # LZ4 decompression fix. Block breaking major (3.x) bumps; 2.x security
      # patches are still allowed.
      - dependency-name: "MessagePack"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/src/vscode-reactor"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(vscode)"
    labels:
      - "dependencies"
      - "vscode-extension"
    # Routine minor/patch bumps arrive as one PR; a major still gets its own so
    # the breaking change is reviewed on its own merits. See the npm entry below
    # for why grouping was introduced.
    groups:
      vscode-extension-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The remaining npm projects — the HeadTrax sample service, the React Native
  # perf harnesses, and the Figma plugin. They were unmonitored until now, so
  # transitive advisories piled up in Component Governance (qs, body-parser and
  # js-yaml were all several patches behind) with nothing raising a PR. Grouped
  # into one entry via `directories` because they share a single reviewer and
  # none of them ships to users; `/src/vscode-reactor` stays separate above so
  # its PRs keep the vscode-specific prefix and label.
  - package-ecosystem: "npm"
    directories:
      - "/samples/apps/headtrax/service"
      - "/tests/startup_perf/BlankRNW"
      - "/tests/stress_perf_rn/StocksGrid"
      - "/tests/stress_perf_rn/VirtualList"
      - "/tools/figma-plugin"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(npm)"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10
    # Ungrouped, the first run of this entry opened 24 PRs in four minutes — one
    # per package per directory — which is unreviewable and was the whole
    # complaint. Grouping is scoped to minor/patch, the bumps that are routine
    # and safe to read as a batch; a major still gets a dedicated PR, because a
    # major is exactly where a breaking change hides and where a per-package
    # diff is worth reading. Dependabot raises one grouped PR per directory, so
    # each harness stays independently revertable.
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The three React Native harnesses pin `react-native` at 0.82.0 on
      # purpose, and that pin transitively fixes the toolchain around it. Each
      # entry below was measured against that pin, not assumed:
      #
      #   eslint            @react-native/eslint-config@0.87.1 declares
      #                     `peer eslint@"^8.0.0 || ^9.0.0"`, so eslint 10 fails
      #                     `npm install` outright with ERESOLVE. The harnesses
      #                     also configure lint through `.eslintrc.js`, the
      #                     format eslint 10 removed. Blocking major keeps both
      #                     the peer range and the config format valid.
      #
      #   @babel/preset-env @babel/preset-env@8.0.5 declares
      #   @babel/core       `peer @babel/core@"^8.0.0"`, but
      #                     @react-native/babel-preset@0.82.0 *depends* on
      #                     `@babel/core@^7.25.2`. Taking preset-env 8 puts two
      #                     major Babel cores in one tree and breaks the Metro
      #                     transform, so core is pinned to 7 with it.
      #
      #   @babel/runtime    Declares no peer dependencies at all -- it is held
      #                     for a different reason. It is the helper package
      #                     that transform-runtime's emitted
      #                     `@babel/runtime/helpers/*` imports resolve against,
      #                     so its major must match the Babel core doing the
      #                     emitting. With core pinned to 7 above, the runtime
      #                     stays on 7.
      #
      # This is a rule about the *runtime/build* toolchain, not about every
      # package with a react-native-adjacent name. @react-native/eslint-config
      # and @react-native/typescript-config are deliberately NOT listed here:
      # they are lint/tsconfig presets with no dependency or peer edge on
      # react-native (typescript-config declares none at all), so they are
      # allowed to move ahead of the 0.82.0 pin.
      #
      # Drop the relevant entry when react-native itself is upgraded.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # better-sqlite3 13 removed the install script that used to reach for a
      # prebuilt binary: v11 declared `install: prebuild-install || node-gyp
      # rebuild`, v13 declares no install script at all. It does ship
      # `prebuilds/<platform>-<arch>.node` inside the npm tarball (win32-x64
      # and linux-x64 among them) and sets `gypfile: false`, but npm never
      # consults those prebuilds at install time -- with a `binding.gyp`
      # present and no install script to short-circuit, npm falls through to
      # its default `node-gyp rebuild`. Measured on Node 22 / npm 10.9.8:
      # `npm install better-sqlite3@13.0.3` shells out to `node-gyp rebuild`
      # and fails outright on a Windows machine whose Visual Studio is newer
      # than node-gyp 11.5.0 can detect. Turning the HeadTrax sample's install
      # into a source build is a poor trade for a sample in a Windows-first
      # repo. Security patches on 11.x still flow through.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
