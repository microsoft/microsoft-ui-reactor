version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "nuget"
    open-pull-requests-limit: 10
    ignore:
      # Windows App SDK packages are pinned via Directory.Build.props
      # (WindowsAppSDKVersion / WindowsAppSDKWinUIVersion) and bumped intentionally,
      # in lockstep across the metapackage and the individually-referenced sub-packages.
      - dependency-name: "Microsoft.WindowsAppSDK"
      - dependency-name: "Microsoft.WindowsAppSDK.WinUI"
      - dependency-name: "Microsoft.WindowsAppSDK.Runtime"

  - package-ecosystem: "npm"
    directory: "/src/vscode-reactor"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(vscode)"
    labels:
      - "dependencies"
      - "vscode-extension"
