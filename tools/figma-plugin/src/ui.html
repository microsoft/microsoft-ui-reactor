<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, sans-serif;
      font-size: 12px;
      padding: 12px;
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
    }
    .status {
      padding: 8px;
      border-radius: 4px;
      background: var(--figma-color-bg-secondary);
      margin-bottom: 8px;
    }
    .connected { color: #0fa573; }
    .disconnected { color: #f24822; }
    .log {
      font-family: monospace;
      font-size: 10px;
      max-height: 100px;
      overflow-y: auto;
      padding: 4px;
      background: var(--figma-color-bg-tertiary);
      border-radius: 4px;
    }
    .log-entry { padding: 1px 0; opacity: 0.8; }
    button {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--figma-color-border);
      background: var(--figma-color-bg-brand);
      color: var(--figma-color-text-onbrand);
      cursor: pointer;
      margin-top: 8px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="status" id="status">Connecting to bridge...</div>
  <div class="status" id="frame-status">No frame selected</div>
  <div style="display: flex; gap: 8px; margin-top: 8px;">
    <button id="generate-btn" onclick="generate()" style="flex: 1; background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); font-weight: 600;">
      ▶ Generate as Reactor
    </button>
    <button id="sync-btn" onclick="requestSync()" style="flex: 0;">↻ Sync</button>
  </div>
  <div class="status" id="mode-status" style="margin-top: 8px; font-size: 10px; opacity: 0.7;">
    Mode: Waiting for generation
  </div>
  <div class="log" id="log"></div>

  <script>
    const BRIDGE_URL = "ws://localhost:9228/figma";
    let ws = null;
    let reconnectTimer = null;

    function log(msg) {
      const el = document.getElementById("log");
      const entry = document.createElement("div");
      entry.className = "log-entry";
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.appendChild(entry);
      el.scrollTop = el.scrollHeight;
      // Keep last 50 entries
      while (el.children.length > 50) el.removeChild(el.firstChild);
    }

    function setStatus(connected) {
      const el = document.getElementById("status");
      el.textContent = connected ? "Connected to bridge" : "Disconnected";
      el.className = `status ${connected ? "connected" : "disconnected"}`;
    }

    function connect() {
      if (ws && ws.readyState <= WebSocket.OPEN) return;

      try {
        ws = new WebSocket(BRIDGE_URL);

        ws.onopen = () => {
          setStatus(true);
          log("WebSocket connected");
          if (reconnectTimer) {
            clearInterval(reconnectTimer);
            reconnectTimer = null;
          }
          // Request initial sync from plugin main thread
          parent.postMessage({ pluginMessage: { type: "request-sync" } }, "*");
        };

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          
          if (data.type === "connected") {
            log("Bridge connected");
          } else if (data.type === "status") {
            log("⏳ " + data.message);
            document.getElementById("mode-status").textContent = "Mode: " + data.message;
          } else if (data.type === "generated") {
            log("✓ Code generated! " + data.chars + " chars → " + data.file);
            document.getElementById("mode-status").textContent = "Mode: Live patching (code generated)";
          } else if (data.type === "generating") {
            log("▶ " + data.message);
            document.getElementById("mode-status").textContent = "Mode: Copilot CLI generating...";
          } else if (data.type === "patched") {
            log("✓ Live patch: " + data.count + " changes applied");
            document.getElementById("mode-status").textContent = "Mode: Live patching";
          } else if (data.type === "ack") {
            log("✓ Design data synced");
          } else if (data.type === "error") {
            log("✗ Error: " + data.message);
            document.getElementById("mode-status").textContent = "Mode: Error — see log";
          } else {
            log("Bridge: " + JSON.stringify(data).substring(0, 100));
          }
        };

        ws.onclose = () => {
          setStatus(false);
          log("WebSocket closed, reconnecting...");
          scheduleReconnect();
        };

        ws.onerror = () => {
          setStatus(false);
        };
      } catch (e) {
        setStatus(false);
        log(`Connection error: ${e}`);
        scheduleReconnect();
      }
    }

    function scheduleReconnect() {
      if (!reconnectTimer) {
        reconnectTimer = setInterval(connect, 3000);
      }
    }

    function requestSync() {
      parent.postMessage({ pluginMessage: { type: "request-sync" } }, "*");
    }

    function generate() {
      parent.postMessage({ pluginMessage: { type: "generate" } }, "*");
      document.getElementById("mode-status").textContent = "Mode: Generating via LLM...";
      log("Triggered initial generation");
    }

    // Receive messages from plugin main thread
    window.onmessage = (event) => {
      const msg = event.data?.pluginMessage;
      if (!msg) return;

      if (msg.type === "sync") {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(msg.payload));
          const mode = msg.payload.type;
          if (mode === "generate") {
            log("Sent: full design tree to bridge");
            log("→ Now ask Copilot: 'Call figma_summary and translate to Reactor code'");
            document.getElementById("mode-status").textContent = "Mode: Awaiting Copilot agent...";
          } else if (mode === "incremental") {
            const count = msg.payload.patches ? msg.payload.patches.length : 0;
            log("Sent: patch (" + count + " changes)");
            document.getElementById("mode-status").textContent = "Mode: Live patching";
          } else {
            log("Sent: full-sync (" + msg.payload.frameName + ")");
          }
        } else {
          log("Not connected — queued");
        }
      } else if (msg.type === "status") {
        document.getElementById("frame-status").textContent = msg.message;
      }
    };

    // Start connection
    connect();
  </script>
</body>
</html>
