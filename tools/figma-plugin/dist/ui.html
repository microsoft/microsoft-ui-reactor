<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, -apple-system, sans-serif; font-size: 13px; background: #FFFFFF; color: #101828; }
    .container { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .frame-status { display: flex; align-items: center; gap: 6px; padding: 10px; background: #F9FAFB; border-radius: 6px; font-size: 13px; color: #4A5565; }
    .frame-status.watching { color: #12B76A; }
    .frame-icon { width: 14px; height: 14px; opacity: 0.4; flex-shrink: 0; }
    .frame-status.watching .frame-icon { opacity: 1; }
    .frame-detail { font-size: 11px; color: #99A1AF; margin-top: 2px; }
    .section-label { font-size: 11px; font-weight: 600; color: #99A1AF; text-transform: uppercase; letter-spacing: 0.5px; margin: 4px 0 4px 0; }
    .config-row { display: flex; gap: 6px; align-items: center; }
    .config-row input { flex: 1; padding: 6px 8px; border-radius: 4px; font-size: 12px; border: 1px solid #D1D5DB; background: #FFF; color: #101828; }
    .config-row input::placeholder { color: #C0C5CC; }
    .hint { font-size: 11px; color: #99A1AF; margin: 2px 0 6px 0; }
    .cmd-box { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; padding: 8px 10px; background: #1E1E2E; color: #CDD6F4; border-radius: 6px; cursor: pointer; word-break: break-all; line-height: 1.5; position: relative; border: 1px solid #313244; }
    .cmd-box:hover { background: #2A2A3C; }
    .cmd-box .copy-hint { position: absolute; top: 4px; right: 6px; font-size: 10px; color: #6C7086; }
    .bottom-bar { padding: 0 12px 12px 12px; }
    .btn-row { display: flex; gap: 6px; }
    .btn { flex: 1; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #0C8CE9; color: #FFF; }
    .btn-primary:hover:not(:disabled) { background: #0A7BD4; }
    .btn-secondary { background: #F3F4F6; color: #101828; border: 1px solid #D1D5DB; }
    .btn-secondary:hover:not(:disabled) { background: #E5E7EB; }
    .tab-row { display: flex; gap: 4px; margin-bottom: 6px; }
    .tab-btn { padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; border: 1px solid #D1D5DB; background: #FFF; color: #4A5565; }
    .tab-btn.active { background: #101828; color: #FFF; border-color: #101828; }
    .hidden { display: none; }
    .toast { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: #101828; color: #FFF; padding: 6px 14px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Frame status -->
    <div class="frame-status" id="frame-status">
      <svg class="frame-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1" y="1" width="12" height="12" rx="1.5"/>
        <line x1="5" y1="1" x2="5" y2="13"/><line x1="9" y1="1" x2="9" y2="13"/>
        <line x1="1" y1="5" x2="13" y2="5"/><line x1="1" y1="9" x2="13" y2="9"/>
      </svg>
      <div>
        <div id="frame-text">Select a frame</div>
        <div class="frame-detail" id="frame-detail"></div>
      </div>
    </div>

    <!-- Project config -->
    <div class="section-label">Output Project</div>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-new" onclick="selectTab('new')">+ New Project</button>
      <button class="tab-btn" id="tab-existing" onclick="selectTab('existing')">Existing Project</button>
    </div>
    <div id="panel-new">
      <div class="config-row">
        <input type="text" id="new-project-name" placeholder="Project name" value="FigmaApp" oninput="updateCommands()" />
      </div>
      <div class="hint">Creates a new Reactor app via <code>mur --create</code></div>
    </div>
    <div id="panel-existing" class="hidden">
      <div class="config-row">
        <input type="text" id="project-path" placeholder="Path to .csproj" oninput="updateCommands()" />
      </div>
      <div class="hint">Full path to your existing Reactor .csproj</div>
    </div>

    <!-- Watch command (copyable) -->
    <div class="section-label">Live Watch <span style="font-weight:400; text-transform:none">(optional)</span></div>
    <div class="cmd-box" id="watch-cmd" onclick="copyText('watch-cmd')">
      <span class="copy-hint">click to copy</span>
    </div>
    <div class="hint">Run this in a terminal to watch for Figma changes</div>
  </div>

  <div class="bottom-bar">
    <div class="btn-row">
      <button class="btn btn-primary" id="generate-btn" onclick="generate()" disabled>
        <span style="font-size:15px">&#10022;</span> Generate
      </button>
      <button class="btn btn-secondary" id="run-btn" onclick="copyRunCmd()" disabled title="Copy dotnet watch command">
        &#9654; Run
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ─── State ───────────────────────────────────────────────────────────────
    var frameInfo = null;

    // ─── Frame tracking ──────────────────────────────────────────────────────
    function setFrame(info) {
      frameInfo = info;
      var el = document.getElementById('frame-text');
      var detail = document.getElementById('frame-detail');
      var container = document.getElementById('frame-status');

      if (info) {
        el.textContent = info.frameName;
        detail.textContent = info.width + ' × ' + info.height + '  ·  ' + info.nodeId;
        container.className = 'frame-status watching';
      } else {
        el.textContent = 'Select a frame';
        detail.textContent = '';
        container.className = 'frame-status';
      }
      updateCommands();
    }

    // ─── Tab switching ───────────────────────────────────────────────────────
    function selectTab(t) {
      document.getElementById('tab-new').className = 'tab-btn' + (t === 'new' ? ' active' : '');
      document.getElementById('tab-existing').className = 'tab-btn' + (t === 'existing' ? ' active' : '');
      document.getElementById('panel-new').className = t === 'new' ? '' : 'hidden';
      document.getElementById('panel-existing').className = t === 'existing' ? '' : 'hidden';
      updateCommands();
    }

    function isNewProject() {
      return document.getElementById('tab-new').className.includes('active');
    }

    function getProjectName() {
      return (document.getElementById('new-project-name').value.trim() || 'FigmaApp');
    }

    function getProjectPath() {
      return document.getElementById('project-path').value.trim();
    }

    // ─── Command generation ──────────────────────────────────────────────────
    function updateCommands() {
      var hasFrame = !!frameInfo;
      var hasUrl = hasFrame && frameInfo.figmaUrl;
      document.getElementById('generate-btn').disabled = !hasFrame;
      document.getElementById('run-btn').disabled = !hasFrame;

      var watchEl = document.getElementById('watch-cmd');
      if (hasUrl) {
        watchEl.innerHTML = '<span class="copy-hint">click to copy</span>' +
          escHtml('mur figma watch "' + frameInfo.figmaUrl + '"');
      } else if (hasFrame) {
        watchEl.innerHTML = '<span class="copy-hint"></span><em style="color:#6C7086">File key not available — copy the URL from your browser instead</em>';
      } else {
        watchEl.innerHTML = '<span class="copy-hint"></span><em style="color:#6C7086">Select a frame to see the watch command</em>';
      }
    }

    function getProjectDir() {
      if (isNewProject()) {
        return getProjectName();
      }
      var p = getProjectPath();
      if (!p) return null;
      // Extract directory from .csproj path
      if (p.toLowerCase().endsWith('.csproj')) {
        var parts = p.replace(/\//g, '\\').split('\\');
        parts.pop();
        return parts.join('\\');
      }
      return p;
    }

    function getCsprojPath() {
      if (isNewProject()) {
        var name = getProjectName();
        return name + '\\' + name + '.csproj';
      }
      return getProjectPath();
    }

    // ─── Generate ────────────────────────────────────────────────────────────
    function generate() {
      if (!frameInfo) return;

      var url = frameInfo.figmaUrl || '[paste Figma URL here]';
      var csproj = getCsprojPath();
      var name = getProjectName();

      // Build the copilot CLI command
      var prompt;
      if (isNewProject()) {
        prompt = 'Create a new Reactor app called ' + name +
          ' using mur --create ' + name +
          ', then translate this Figma design into it: ' + url +
          '. After generating the code, run: dotnet watch run --project ' + csproj;
      } else {
        if (!csproj) {
          showToast('Set the project path first');
          return;
        }
        prompt = 'Translate this Figma design into Reactor code: ' + url +
          '. Write the output to the project at ' + csproj +
          '. After generating, run: dotnet watch run --project ' + csproj;
      }

      var cmd = 'copilot -p "' + prompt.replace(/"/g, '\\"') + '"';
      copyToClipboard(cmd);
      showToast('Copilot command copied — paste in terminal');
    }

    function copyRunCmd() {
      var csproj = getCsprojPath();
      if (csproj) {
        copyToClipboard('dotnet watch run --project ' + csproj);
        showToast('Run command copied');
      }
    }

    // ─── Clipboard / toast ───────────────────────────────────────────────────
    function copyText(elId) {
      var el = document.getElementById(elId);
      // Get text without the "click to copy" hint
      var text = el.innerText.replace('click to copy', '').trim();
      if (text && !text.startsWith('Select')) {
        copyToClipboard(text);
        showToast('Copied!');
      }
    }

    function copyToClipboard(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    function showToast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show';
      setTimeout(function() { el.className = 'toast'; }, 2000);
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ─── Messages from plugin sandbox ────────────────────────────────────────
    window.onmessage = function(event) {
      var msg = event.data && event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'frame-selected') {
        setFrame(msg);
      } else if (msg.type === 'no-frame') {
        setFrame(null);
        // Show diagnostic info
        if (msg.message) {
          document.getElementById('frame-detail').textContent = msg.message;
        }
      }
    };

    // Request initial frame info
    parent.postMessage({ pluginMessage: { type: 'request-frame-info' } }, '*');
  </script>
</body>
</html>
