<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, -apple-system, sans-serif; font-size: 13px; background: #FFFFFF; color: #101828; }
    .container { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .status-console { background: #F9FAFB; border-radius: 4px; overflow: hidden; }
    .status-bar { display: flex; align-items: center; padding: 6px 8px; background: #F3F4F6; gap: 6px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.connected { background: #12B76A; }
    .status-dot.disconnected { background: #E7000B; }
    .status-text { flex: 1; font-size: 13px; font-weight: 500; }
    .status-text.connected { color: #12B76A; }
    .status-text.disconnected { color: #E7000B; }
    .setup-btn { padding: 2px 8px; border-radius: 4px; background: #FFF; border: 1px solid #D1D5DB; font-size: 12px; color: #0A0A0A; cursor: pointer; font-weight: 500; }
    .setup-btn:hover { background: #F3F4F6; }
    .log-area { padding: 8px; max-height: 89px; overflow-y: auto; }
    .log-entry { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; font-size: 12px; line-height: 1.4; }
    .log-time { color: #99A1AF; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
    .log-icon { width: 12px; height: 12px; flex-shrink: 0; margin-top: 2px; opacity: 0.5; }
    .log-msg { color: #4A5565; flex: 1; word-break: break-word; }
    .frame-status { display: flex; align-items: center; gap: 6px; padding: 8px; background: #F9FAFB; border-radius: 4px; font-size: 13px; color: #101828; }
    .frame-icon { width: 14px; height: 14px; opacity: 0.4; }
    .frame-status.watching { color: #12B76A; }
    .bottom-bar { padding: 9px 12px 12px 12px; background: #FFF; }
    .split-btn { display: flex; width: 100%; height: 36px; border-radius: 8px; overflow: hidden; }
    .split-main { flex: 1; padding: 8px 16px; background: #0C8CE9; color: #FFF; border: none; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .split-main:hover { background: #0A7BD4; }
    .split-main:disabled { background: #D1D5DB; color: #99A1AF; cursor: not-allowed; }
    .split-drop { width: 36px; background: #0A7BD4; color: #FFF; border: none; border-left: 1px solid rgba(255,255,255,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .split-drop:hover { background: #0869B8; }
    .split-drop:disabled { background: #C0C5CC; cursor: not-allowed; }
    .flyout-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 10; }
    .flyout-overlay.open { display: flex; align-items: center; justify-content: center; }
    .flyout { background: #FFF; border: 1px solid #E5E7EB; border-radius: 8px; padding: 16px; width: 296px; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    .flyout h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #101828; }
    .flyout .close-btn { float: right; background: none; border: none; font-size: 16px; cursor: pointer; color: #99A1AF; padding: 0; }
    .flyout .close-btn:hover { color: #101828; }
    .section-label { font-size: 11px; font-weight: 600; color: #99A1AF; margin: 10px 0 4px 0; text-transform: uppercase; letter-spacing: 0.5px; }
    .flyout input { width: 100%; padding: 6px 8px; border-radius: 4px; font-size: 12px; border: 1px solid #D1D5DB; background: #FFF; color: #101828; margin-bottom: 4px; }
    .flyout .hint { font-size: 11px; color: #99A1AF; margin: 2px 0 8px 0; }
    .flyout .tab-row { display: flex; gap: 4px; margin-bottom: 8px; }
    .flyout .tab-btn { padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; border: 1px solid #D1D5DB; background: #FFF; color: #4A5565; }
    .flyout .tab-btn.active { background: #030213; color: #FFF; border-color: #030213; }
    .copy-cmd { font-family: monospace; font-size: 10px; padding: 8px; background: #F3F4F6; border-radius: 4px; margin: 6px 0; word-break: break-all; cursor: pointer; border: 1px dashed #D1D5DB; line-height: 1.5; color: #4A5565; }
    .copy-cmd:hover { background: #E5E7EB; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-console">
      <div class="status-bar">
        <div class="status-dot disconnected" id="status-dot"></div>
        <div class="status-text disconnected" id="status-text">Disconnected</div>
        <button class="setup-btn" onclick="openSetup()">Setup</button>
      </div>
      <div class="log-area" id="log"></div>
    </div>
    <div class="frame-status" id="frame-status">
      <svg class="frame-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="12" height="12" rx="1.5"/><line x1="5" y1="1" x2="5" y2="13"/><line x1="9" y1="1" x2="9" y2="13"/><line x1="1" y1="5" x2="13" y2="5"/><line x1="1" y1="9" x2="13" y2="9"/></svg>
      <span id="frame-text">Select a frame to watch</span>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="split-btn">
      <button class="split-main" id="action-btn" onclick="generate()" disabled>
        <span style="font-size:16px">&#10022;</span> Generate
      </button>
      <button class="split-drop" id="launch-btn" onclick="launchWatch()" disabled title="Launch App">&#9654;</button>
    </div>
  </div>
  <div class="flyout-overlay" id="setup-flyout" onclick="if(event.target===this)closeSetup()">
    <div class="flyout">
      <button class="close-btn" onclick="closeSetup()">&#10005;</button>
      <h3>Bridge Setup</h3>
      <div class="section-label">Output Project</div>
      <div class="tab-row">
        <button class="tab-btn active" id="tab-new" onclick="selectTab('new')">+ New Project</button>
        <button class="tab-btn" id="tab-existing" onclick="selectTab('existing')">Existing Project</button>
      </div>
      <div id="panel-new">
        <input type="text" id="new-project-name" placeholder="Project name" value="FigmaApp" oninput="updateStartCmd()" />
        <div class="hint">Creates a new Reactor app under samples/apps/</div>
      </div>
      <div id="panel-existing" class="hidden">
        <input type="text" id="output-path" placeholder="Paste .csproj path here" oninput="updateStartCmd()" />
        <div class="hint">Paste the full path to your .csproj file</div>
      </div>
      <div class="section-label">Start Command</div>
      <div class="hint">Copy &amp; paste into a terminal:</div>
      <div class="copy-cmd" id="start-cmd" onclick="copyStartCmd()"></div>
      <div class="hint" id="copy-hint" style="text-align:center">Click to copy</div>
    </div>
  </div>
  <script>
    var BRIDGE_URL="ws://localhost:9228/figma",BRIDGE_ROOT="C:\\repos\\microsoft-ui-reactor\\tools\\FigmaBridge",ws=null,reconnectTimer=null;
    function log(m,t){var el=document.getElementById("log"),e=document.createElement("div");e.className="log-entry";var time=new Date().toLocaleTimeString([],{hour12:false});var ico=t==="error"?'<svg viewBox="0 0 12 12" class="log-icon"><circle cx="6" cy="6" r="5" fill="none" stroke="#E7000B" stroke-width="1.2"/><line x1="6" y1="3.5" x2="6" y2="6.5" stroke="#E7000B" stroke-width="1.2"/><circle cx="6" cy="8.5" r="0.6" fill="#E7000B"/></svg>':'<svg viewBox="0 0 12 12" class="log-icon"><circle cx="6" cy="6" r="5" fill="none" stroke="#99A1AF" stroke-width="1.2"/><line x1="6" y1="3.5" x2="6" y2="6.5" stroke="#99A1AF" stroke-width="1.2"/><circle cx="6" cy="8.5" r="0.6" fill="#99A1AF"/></svg>';e.innerHTML='<span class="log-time">'+time+'</span>'+ico+'<span class="log-msg">'+m+'</span>';el.appendChild(e);el.scrollTop=el.scrollHeight;while(el.children.length>30)el.removeChild(el.firstChild)}
    var isConnected=false,hasFrame=false;
    function setStatus(c){isConnected=c;document.getElementById("status-dot").className="status-dot "+(c?"connected":"disconnected");document.getElementById("status-text").className="status-text "+(c?"connected":"disconnected");document.getElementById("status-text").textContent=c?"Connected":"Disconnected";updateBtns()}
    function setFrame(t,w){hasFrame=w;document.getElementById("frame-text").textContent=t;document.getElementById("frame-status").className="frame-status"+(w?" watching":"");updateBtns()}
    function updateBtns(){var ok=isConnected&&hasFrame;document.getElementById("action-btn").disabled=!ok;document.getElementById("launch-btn").disabled=!isConnected}
    function connect(){if(ws&&ws.readyState<=WebSocket.OPEN)return;try{ws=new WebSocket(BRIDGE_URL);ws.onopen=function(){setStatus(true);log("Connected to bridge");if(reconnectTimer){clearInterval(reconnectTimer);reconnectTimer=null}parent.postMessage({pluginMessage:{type:"request-sync"}},"*");var p=document.getElementById("output-path").value;if(p)sendToBridge({type:"set-output",path:p})};ws.onmessage=function(e){handleBridgeMessage(JSON.parse(e.data))};ws.onclose=function(){setStatus(false);scheduleReconnect()};ws.onerror=function(){setStatus(false)}}catch(e){setStatus(false);scheduleReconnect()}}
    function scheduleReconnect(){if(!reconnectTimer)reconnectTimer=setInterval(connect,3000)}
    function sendToBridge(d){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(d))}
    function handleBridgeMessage(d){if(d.type==="connected")log("Bridge ready");else if(d.type==="status")log(d.message);else if(d.type==="generated")log("Code generated \u2014 "+d.chars+" chars");else if(d.type==="generating")log(d.message);else if(d.type==="patched")log(d.count+" live patches applied");else if(d.type==="ack")log("Design synced");else if(d.type==="request-sync"){parent.postMessage({pluginMessage:{type:"request-sync"}},"*")}else if(d.type==="watch-launched")log("dotnet watch running");else if(d.type==="project-created"){log("Project created: "+d.path);document.getElementById("output-path").value=d.path;updateStartCmd()}else if(d.type==="output-set"){log("Output: "+d.path);document.getElementById("output-path").value=d.path;parent.postMessage({pluginMessage:{type:"save-config",outputPath:d.path}},"*");updateStartCmd()}else if(d.type==="error")log(d.message,"error");else log(JSON.stringify(d).substring(0,60))}
    function openSetup(){updateStartCmd();document.getElementById("setup-flyout").className="flyout-overlay open"}
    function closeSetup(){document.getElementById("setup-flyout").className="flyout-overlay"}
    function selectTab(t){document.getElementById("tab-new").className="tab-btn"+(t==="new"?" active":"");document.getElementById("tab-existing").className="tab-btn"+(t==="existing"?" active":"");document.getElementById("panel-new").className=t==="new"?"":"hidden";document.getElementById("panel-existing").className=t==="existing"?"":"hidden";updateStartCmd()}
    function getOutputPath(){var isNew=document.getElementById("tab-new").className.includes("active");if(isNew){var n=(document.getElementById("new-project-name").value.trim()||"FigmaApp").toLowerCase();return{dir:BRIDGE_ROOT.replace("\\tools\\FigmaBridge","\\samples\\apps\\"+n),csproj:null,isNew:true}}var raw=document.getElementById("output-path").value.trim();if(!raw)return{dir:"<paste-csproj-path>",csproj:null,isNew:false};if(raw.toLowerCase().endsWith(".csproj")){var parts=raw.replace(/\//g,"\\").split("\\");var csproj=raw;parts.pop();return{dir:parts.join("\\"),csproj:csproj,isNew:false}}var dir=raw.replace(/\//g,"\\");var dirName=dir.split("\\").pop();var guessedCsproj=dir+"\\"+dirName.charAt(0).toUpperCase()+dirName.slice(1)+".csproj";return{dir:dir,csproj:guessedCsproj,isNew:false}}
    function updateStartCmd(){var o=getOutputPath();var cmd="cd "+BRIDGE_ROOT+"; dotnet run -- --output "+o.dir;if(!o.isNew&&o.csproj)cmd="Start-Process pwsh -ArgumentList '-NoExit','-Command','dotnet watch run --project "+o.csproj+"'; "+cmd;document.getElementById("start-cmd").textContent=cmd}
    function copyStartCmd(){var t=document.getElementById("start-cmd").innerText;var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);document.getElementById("copy-hint").textContent="\u2713 Copied!";setTimeout(function(){document.getElementById("copy-hint").textContent="Click to copy"},2000)}
    function launchWatch(){sendToBridge({type:"launch-watch"});log("Launching app...")}
    function generate(){var o=getOutputPath();if(o.isNew){var n=document.getElementById("new-project-name").value.trim()||"FigmaApp";sendToBridge({type:"create-project",name:n});log("Creating project: "+n);setTimeout(function(){parent.postMessage({pluginMessage:{type:"generate"}},"*");log("Generating...")},1500)}else{if(o.dir&&o.dir!=="<paste-csproj-path>")sendToBridge({type:"set-output",path:o.dir});parent.postMessage({pluginMessage:{type:"generate"}},"*");log("Generating...")}}
    window.onmessage=function(event){var msg=event.data&&event.data.pluginMessage;if(!msg)return;if(msg.type==="sync"){if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(msg.payload));if(msg.payload.type==="generate")log("Design tree sent \u2192 Copilot launching...");else if(msg.payload.type==="incremental")log((msg.payload.patches?msg.payload.patches.length:0)+" patches sent");else log("Synced: "+msg.payload.frameName)}else log("Not connected \u2014 open Setup","error")}else if(msg.type==="status"){setFrame(msg.message,msg.message.indexOf("Watching")===0)}else if(msg.type==="config-loaded"){if(msg.outputPath){document.getElementById("output-path").value=msg.outputPath;updateStartCmd()}}};
    parent.postMessage({pluginMessage:{type:"load-config"}},"*");
    log("Bridge not connected. Click Setup to configure.","error");
    connect();
  </script>
</body>
</html>
