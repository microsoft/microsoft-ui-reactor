<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1100 365" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <style>
    text { fill: #1f2328; }
    .label { font-size: 12.5px; font-weight: 500; }
    .sub { font-size: 10.5px; fill: #57606a; }
    .edge-label { font-size: 10.5px; fill: #57606a; }
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
    .box-accent { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .box-out { fill: #d1f4d6; stroke: #1a7f37; stroke-width: 1.5; }
    .box-aot { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .diamond { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .edge-dashed { stroke: #57606a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .marker-fill { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .sub { fill: #8b949e; }
      .edge-label { fill: #8b949e; }
      .box { fill: #161b22; stroke: #8b949e; }
      .box-accent { fill: #0c2d6b; stroke: #58a6ff; }
      .box-out { fill: #033a16; stroke: #3fb950; }
      .box-aot { fill: #341a00; stroke: #d29922; }
      .diamond { fill: #341a00; stroke: #d29922; }
      .edge { stroke: #8b949e; }
      .edge-dashed { stroke: #8b949e; }
      .marker-fill { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="marker-fill" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Project file -->
  <rect class="box-accent" x="20" y="60" width="190" height="76" rx="6"/>
  <text class="label" x="115" y="88" text-anchor="middle">MyApp.csproj</text>
  <text class="sub" x="115" y="106" text-anchor="middle">PublishAot=true</text>
  <text class="sub" x="115" y="122" text-anchor="middle">Platforms x64;ARM64</text>

  <line class="edge" x1="210" y1="98" x2="248" y2="98" marker-end="url(#arr)"/>

  <!-- Build-time analyzers -->
  <rect class="box" x="250" y="60" width="200" height="76" rx="6"/>
  <text class="label" x="350" y="88" text-anchor="middle">dotnet build</text>
  <text class="sub" x="350" y="106" text-anchor="middle">trim and AOT analyzers run</text>
  <text class="sub" x="350" y="122" text-anchor="middle">IL2xxx and IL3xxx warnings</text>

  <line class="edge" x1="450" y1="98" x2="478" y2="98" marker-end="url(#arr)"/>

  <!-- dotnet publish -->
  <polygon class="diamond" points="480,98 580,56 680,98 580,140"/>
  <text class="label" x="580" y="94" text-anchor="middle">dotnet publish</text>
  <text class="sub" x="580" y="111" text-anchor="middle">-r win-x64 | win-arm64</text>

  <line class="edge" x1="680" y1="98" x2="708" y2="98" marker-end="url(#arr)"/>

  <!-- ILCompiler -->
  <rect class="box-aot" x="710" y="60" width="190" height="76" rx="6"/>
  <text class="label" x="805" y="88" text-anchor="middle">ILCompiler</text>
  <text class="sub" x="805" y="106" text-anchor="middle">removes unreachable code</text>
  <text class="sub" x="805" y="122" text-anchor="middle">compiles to machine code</text>

  <line class="edge" x1="900" y1="98" x2="928" y2="98" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect class="box-out" x="930" y="60" width="150" height="76" rx="6"/>
  <text class="label" x="1005" y="88" text-anchor="middle">MyApp.exe</text>
  <text class="sub" x="1005" y="106" text-anchor="middle">native code</text>
  <text class="sub" x="1005" y="122" text-anchor="middle">no JIT at run time</text>

  <!-- Feature switch -->
  <rect class="box" x="680" y="200" width="250" height="64" rx="6"/>
  <text class="label" x="805" y="222" text-anchor="middle">Reactor.DevtoolsSupport</text>
  <text class="sub" x="805" y="239" text-anchor="middle">Release default: false, Trim="true"</text>
  <text class="sub" x="805" y="254" text-anchor="middle">ILCompiler treats it as a constant</text>

  <line class="edge-dashed" x1="805" y1="200" x2="805" y2="139" marker-end="url(#arr)"/>
  <text class="edge-label" x="815" y="174">feature switch</text>

  <line class="edge" x1="745" y1="264" x2="660" y2="318" marker-end="url(#arr)"/>
  <line class="edge" x1="865" y1="264" x2="940" y2="318" marker-end="url(#arr)"/>

  <!-- Switch off -->
  <rect class="box-out" x="520" y="320" width="270" height="70" rx="6"/>
  <text class="label" x="655" y="345" text-anchor="middle">Switch off</text>
  <text class="sub" x="655" y="362" text-anchor="middle">devtools code is removed</text>
  <text class="sub" x="655" y="377" text-anchor="middle">CI checks the .mstat file for this</text>

  <!-- Switch on -->
  <rect class="box-accent" x="810" y="320" width="270" height="70" rx="6"/>
  <text class="label" x="945" y="345" text-anchor="middle">Switch on + Devtools package</text>
  <text class="sub" x="945" y="362" text-anchor="middle">devtools code is kept</text>
  <text class="sub" x="945" y="377" text-anchor="middle">--devtools run works</text>

  <!-- Left note -->
  <rect class="box" x="20" y="200" width="430" height="64" rx="6"/>
  <text class="label" x="235" y="222" text-anchor="middle">Fix warnings at build time</text>
  <text class="sub" x="235" y="239" text-anchor="middle">Each warning names code that can fail after trimming.</text>
  <text class="sub" x="235" y="254" text-anchor="middle">A clean build is not proof: run the published exe too.</text>
  <line class="edge-dashed" x1="350" y1="200" x2="350" y2="139" marker-end="url(#arr)"/>
</svg>
